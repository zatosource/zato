<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Zato</title>
<style>

/* ------------------------------------------------------------ */
/* Deploy - fonts and tokens                                     */
/* ------------------------------------------------------------ */

@font-face {
    font-family: ZatoMainFontLight;
    src: url("/zato-deploy/fonts/Jost-Light.ttf");
    font-display: swap;
}

@font-face {
    font-family: ZatoMainFont;
    src: url("/zato-deploy/fonts/Jost-Regular.ttf");
    font-display: swap;
}

@font-face {
    font-family: ZatoMainFontMedium;
    src: url("/zato-deploy/fonts/Jost-Medium.ttf");
    font-display: swap;
}

:root {
    --deploy-bg: #0a0e1a;
    --deploy-bg-panel: rgba(13, 17, 23, 0.82);
    --deploy-bg-raised: #111827;
    --deploy-bg-raised-hover: #1e293b;
    --deploy-border: rgba(255, 255, 255, 0.06);
    --deploy-border-strong: rgba(255, 255, 255, 0.12);
    --deploy-accent: #3b82f6;
    --deploy-accent-light: #60a5fa;
    --deploy-accent-cyan: #06b6d4;
    --deploy-accent-soft: rgba(59, 130, 246, 0.08);
    --deploy-accent-soft-strong: rgba(96, 165, 250, 0.18);
    --deploy-green: #6fae84;
    --deploy-green-glow: rgba(111, 174, 132, 0.35);
    --deploy-red: #ef4444;
    --deploy-red-soft: rgba(239, 68, 68, 0.08);
    --deploy-text: #f1f5f9;
    --deploy-text-muted: #94a3b8;
    --deploy-text-faint: #64748b;
    --deploy-track: rgba(255, 255, 255, 0.07);
    --deploy-grid-line: rgba(255, 255, 255, 0.025);
    --deploy-font-mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Fira Mono', Menlo, Consolas, monospace;
    --deploy-page-padding: 48px;
    --deploy-ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
    --deploy-hover-delay: 120ms;
}

*,
*::before,
*::after {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    font-family: ZatoMainFont, sans-serif;
    color: var(--deploy-text);
    background:
        radial-gradient(900px circle at 88% -12%, rgba(59, 130, 246, 0.11), transparent 60%),
        radial-gradient(720px circle at -8% 112%, rgba(111, 174, 132, 0.07), transparent 60%),
        var(--deploy-bg);
    -webkit-font-smoothing: antialiased;
}

/* ------------------------------------------------------------ */
/* Deploy - shell, backdrop and header                           */
/* ------------------------------------------------------------ */

.deploy-backdrop {
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(var(--deploy-grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--deploy-grid-line) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at 50% 28%, #000 18%, transparent 72%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 28%, #000 18%, transparent 72%);
    pointer-events: none;
}

.deploy-shell {
    position: relative;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    min-height: 620px;
}

.deploy-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px var(--deploy-page-padding);
    border-bottom: 1px solid var(--deploy-border);
}

.deploy-header-brand {
    display: flex;
    gap: 26px;
    align-items: center;
    height: 24px;
}

.deploy-header-logo {
    display: block;
    flex: none;
    width: 66.53px;
    height: 24px;
    color: var(--deploy-text);
}

.deploy-header-brand-separator {
    position: relative;
    top: 2px;
    flex: none;
    width: 1px;
    height: 24px;
    background: var(--deploy-border-strong);
}

.deploy-header-logo-azure {
    position: relative;
    top: 2px;
    display: block;
    flex: none;
    width: 25.47px;
    height: 24px;
    margin-left: -6px;
}

.deploy-header-host {
    font-family: var(--deploy-font-mono);
    font-size: 13px;
    color: var(--deploy-text-faint);
}

.deploy-header-host-port {
    color: var(--deploy-accent-light);
}

/* ------------------------------------------------------------ */
/* Deploy - main layout                                          */
/* ------------------------------------------------------------ */

.deploy-main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 80px;
    align-items: start;
    width: 100%;
    max-width: 1240px;
    margin: 0 auto;
    padding: 32px var(--deploy-page-padding) 24px;
}

.deploy-status {
    padding-top: 6px;
}

@keyframes deploy-pulse {
    50% {
        opacity: 0.35;
        transform: scale(0.55);
    }
}

/* ------------------------------------------------------------ */
/* Deploy - status column                                        */
/* ------------------------------------------------------------ */

.deploy-status-step {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    font-family: var(--deploy-font-mono);
    font-size: 14px;
    color: var(--deploy-accent-light);
}

.deploy-status-step-separator,
.deploy-status-step-total {
    color: var(--deploy-text-faint);
}

body[data-state="ready"] .deploy-status-step {
    color: var(--deploy-green);
}

body[data-state="failed"] .deploy-status-step {
    color: var(--deploy-red);
}

.deploy-status-title {
    min-height: 1.1em;
    margin: 0 0 18px;
    font-family: ZatoMainFontLight, sans-serif;
    font-size: 48px;
    font-weight: normal;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -1.2px;
    color: var(--deploy-text);
}

.deploy-status-detail {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 22px;
    min-height: 22px;
    font-family: var(--deploy-font-mono);
    font-size: 13.5px;
    color: var(--deploy-text-muted);
}

.deploy-status-detail-item[data-kind="error"] {
    color: var(--deploy-red);
}

.deploy-status-detail-item[data-kind="command"] {
    padding: 0 8px;
    color: var(--deploy-text);
    background: var(--deploy-bg-raised);
}
/* ------------------------------------------------------------ */
/* Deploy - progress                                             */
/* ------------------------------------------------------------ */

.deploy-progress {
    display: flex;
    gap: 3px;
    height: 4px;
    margin-top: 40px;
}

.deploy-progress-segment {
    position: relative;
    min-width: 10px;
    overflow: hidden;
    background: var(--deploy-track);
}

.deploy-progress-fill {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 0;
    background: var(--deploy-accent);
    transition: width 0.5s var(--deploy-ease-out), background-color 0.5s ease;
}

.deploy-progress-segment[data-status="active"] .deploy-progress-fill {
    background: linear-gradient(90deg, var(--deploy-accent), var(--deploy-accent-cyan));
}

.deploy-progress-segment[data-status="active"] .deploy-progress-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
    animation: deploy-shimmer 1.4s linear infinite;
}

.deploy-progress-segment[data-status="failed"] .deploy-progress-fill {
    background: var(--deploy-red);
}

.deploy-progress-ready {
    display: none;
    margin-top: 30px;
    font-family: var(--deploy-font-mono);
    font-size: 14px;
    line-height: 14px;
    color: var(--deploy-green);
}

body[data-state="ready"] .deploy-progress {
    display: none;
}

body[data-state="ready"] .deploy-progress-ready {
    display: block;
}

@keyframes deploy-shimmer {
    from {
        transform: translateX(-100%);
    }
    to {
        transform: translateX(100%);
    }
}

.deploy-progress-meta {
    display: flex;
    justify-content: space-between;
    margin-top: 14px;
    font-family: var(--deploy-font-mono);
    font-size: 13px;
    color: var(--deploy-text-faint);
}

.deploy-progress-percent {
    color: var(--deploy-text);
}

body[data-state="ready"] .deploy-progress-percent {
    color: var(--deploy-green);
}

body[data-state="ready"] .deploy-progress-elapsed {
    display: none;
}

/* ------------------------------------------------------------ */
/* Deploy - stages                                               */
/* ------------------------------------------------------------ */

.deploy-stages {
    margin: 0;
    padding: 0;
    list-style: none;
    border: 1px solid var(--deploy-border);
    background: var(--deploy-bg-panel);
}

.deploy-stage {
    display: grid;
    grid-template-columns: 16px 24px minmax(0, 1fr) auto;
    gap: 14px;
    align-items: center;
    padding: 10px 18px;
    border-bottom: 1px solid var(--deploy-border);
    font-size: 15.5px;
    color: var(--deploy-text-faint);
    transition: color 0.4s ease, background-color 0.4s ease;
}

.deploy-stage:last-child {
    border-bottom: none;
}

.deploy-stage[data-status="done"] {
    color: var(--deploy-text-muted);
}

.deploy-stage[data-status="active"] {
    color: var(--deploy-text);
    background: linear-gradient(90deg, var(--deploy-accent-soft), transparent 75%);
}

.deploy-stage[data-status="failed"] {
    color: var(--deploy-text);
    background: linear-gradient(90deg, var(--deploy-red-soft), transparent 75%);
}

.deploy-stage-index,
.deploy-stage-time {
    font-family: var(--deploy-font-mono);
    font-size: 12.5px;
    color: var(--deploy-text-faint);
}

.deploy-stage[data-status="active"] .deploy-stage-index {
    color: var(--deploy-accent-light);
}

.deploy-stage[data-status="failed"] .deploy-stage-index {
    color: var(--deploy-red);
}

.deploy-stage-name {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.deploy-stage-marker {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
}

.deploy-stage-spinner {
    display: block;
    width: 16px;
    height: 16px;
    fill: none;
    stroke-width: 5;
}

.deploy-stage-spinner-track {
    stroke: var(--deploy-border-strong);
    transition: stroke 0.4s ease;
}

.deploy-stage-spinner-arc {
    stroke: var(--deploy-accent-light);
    stroke-linecap: butt;
    stroke-dasharray: 1 150;
    opacity: 0;
}

.deploy-stage[data-status="active"] .deploy-stage-spinner,
.deploy-component[data-status="active"] .deploy-stage-spinner {
    animation: deploy-spinner-rotate 1.4s linear infinite;
}

.deploy-stage[data-status="active"] .deploy-stage-spinner-track,
.deploy-component[data-status="active"] .deploy-stage-spinner-track {
    stroke: var(--deploy-accent-soft-strong);
}

.deploy-stage[data-status="active"] .deploy-stage-spinner-arc,
.deploy-component[data-status="active"] .deploy-stage-spinner-arc {
    opacity: 1;
    animation: deploy-spinner-dash 1.4s ease-in-out infinite;
}

.deploy-stage[data-status="done"] .deploy-stage-spinner,
.deploy-stage[data-status="failed"] .deploy-stage-spinner,
.deploy-component[data-status="done"] .deploy-stage-spinner,
.deploy-component[data-status="failed"] .deploy-stage-spinner {
    display: none;
}

@keyframes deploy-spinner-rotate {
    to {
        transform: rotate(360deg);
    }
}

@keyframes deploy-spinner-dash {
    0% {
        stroke-dasharray: 1 150;
        stroke-dashoffset: 0;
    }
    50% {
        stroke-dasharray: 90 150;
        stroke-dashoffset: -35;
    }
    100% {
        stroke-dasharray: 90 150;
        stroke-dashoffset: -124;
    }
}

.deploy-stage-marker-icon {
    display: none;
    width: 16px;
    height: 16px;
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: square;
    stroke-linejoin: miter;
}

.deploy-stage-marker-done {
    stroke: var(--deploy-green);
}

.deploy-stage-marker-failed {
    stroke: var(--deploy-red);
}

.deploy-stage[data-status="done"] .deploy-stage-marker-done,
.deploy-stage[data-status="failed"] .deploy-stage-marker-failed,
.deploy-component[data-status="done"] .deploy-stage-marker-done,
.deploy-component[data-status="failed"] .deploy-stage-marker-failed {
    display: block;
}

/* ------------------------------------------------------------ */
/* Deploy - components started by a stage                        */
/* ------------------------------------------------------------ */

.deploy-stage[data-has-components="true"] {
    border-bottom: none;
}

.deploy-components {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 7px 24px;
    padding: 0 18px 12px 86px;
    border-bottom: 1px solid var(--deploy-border);
    transition: background-color 0.4s ease;
}

.deploy-components[data-status="active"] {
    background: linear-gradient(90deg, var(--deploy-accent-soft), transparent 75%);
}

.deploy-components[data-status="failed"] {
    background: linear-gradient(90deg, var(--deploy-red-soft), transparent 75%);
}

.deploy-component {
    display: flex;
    gap: 10px;
    align-items: center;
    min-width: 0;
    font-size: 13.5px;
    color: var(--deploy-text-faint);
    transition: color 0.4s ease;
}

.deploy-component[data-status="done"] {
    color: var(--deploy-text-muted);
}

.deploy-component[data-status="active"],
.deploy-component[data-status="failed"] {
    color: var(--deploy-text);
}

.deploy-component .deploy-stage-marker,
.deploy-component .deploy-stage-spinner,
.deploy-component .deploy-stage-marker-icon {
    width: 12px;
    height: 12px;
}

.deploy-component-name {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

/* ------------------------------------------------------------ */
/* Deploy - log                                                  */
/* ------------------------------------------------------------ */

.deploy-log {
    display: flex;
    flex-direction: column;
    flex: 1;
    width: 100%;
    max-width: 1240px;
    min-height: 0;
    margin: 0 auto;
    padding: 0 var(--deploy-page-padding) 28px;
}

.deploy-log-panel {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 110px;
    border: 1px solid var(--deploy-border);
    background: var(--deploy-bg-panel);
}

.deploy-log-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px 8px 18px;
    border-bottom: 1px solid var(--deploy-border);
    font-family: var(--deploy-font-mono);
    font-size: 12px;
    color: var(--deploy-text-faint);
}

.deploy-log-live {
    width: 6px;
    height: 6px;
    background: var(--deploy-green);
    box-shadow: 0 0 8px var(--deploy-green-glow);
    animation: deploy-pulse 1.5s ease-in-out infinite;
}

body[data-state="failed"] .deploy-log-live {
    background: var(--deploy-red);
    box-shadow: none;
    animation: none;
}

.deploy-log-copy {
    margin-left: auto;
    padding: 3px 10px;
    border: 1px solid var(--deploy-border-strong);
    font: inherit;
    color: var(--deploy-text-muted);
    background: transparent;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
}

.deploy-log-copy:hover {
    border-color: var(--deploy-accent);
    color: var(--deploy-text);
    background: var(--deploy-accent-soft);
    transition-delay: var(--deploy-hover-delay);
}

.deploy-log-copy:active {
    background: var(--deploy-accent-soft-strong);
    transition-delay: 0s;
}

.tippy-box[data-theme~="zato-deploy"] {
    border: 1px solid var(--deploy-border-strong);
    border-radius: 0;
    font-family: var(--deploy-font-mono);
    font-size: 12px;
    line-height: 1.4;
    color: var(--deploy-text);
    background: var(--deploy-bg-raised-hover);
}

.tippy-box[data-theme~="zato-deploy"] > .tippy-arrow {
    color: var(--deploy-bg-raised-hover);
}

.tippy-box[data-theme~="zato-deploy"] > .tippy-content {
    padding: 6px 10px;
}

.deploy-log-lines {
    flex: 1;
    min-height: 0;
    padding: 12px 18px;
    overflow-y: auto;
    font-family: var(--deploy-font-mono);
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--deploy-text-muted);
    mask-image: linear-gradient(to bottom, transparent, #000 44px);
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 44px);
    scrollbar-width: auto;
    scrollbar-color: var(--deploy-border-strong) transparent;
}

.deploy-log-line {
    display: flex;
    gap: 16px;
    white-space: pre-wrap;
    word-break: break-word;
}

.deploy-log-line-time {
    flex: none;
    color: var(--deploy-text-faint);
    opacity: 0.7;
}

.deploy-log-line:last-child .deploy-log-line-text {
    color: var(--deploy-text);
}

.deploy-log-line[data-kind="ok"] .deploy-log-line-text {
    color: var(--deploy-green);
}

.deploy-log-line[data-kind="error"] .deploy-log-line-text {
    color: var(--deploy-red);
}

/* ------------------------------------------------------------ */
/* Deploy - narrow screens and reduced motion                    */
/* ------------------------------------------------------------ */

@media (max-width: 920px) {
    :root {
        --deploy-page-padding: 22px;
    }

    .deploy-main {
        grid-template-columns: minmax(0, 1fr);
        gap: 48px;
        padding-top: 44px;
    }

    .deploy-status-title {
        font-size: 36px;
    }

    .deploy-header-host {
        display: none;
    }
}

@media (max-height: 820px) {
    .deploy-header {
        padding-top: 14px;
        padding-bottom: 14px;
    }

    .deploy-main {
        padding-top: 22px;
        padding-bottom: 18px;
    }

    .deploy-stage {
        padding-top: 7px;
        padding-bottom: 7px;
        font-size: 15px;
    }

    .deploy-components {
        gap: 5px 24px;
        padding-bottom: 9px;
    }

    .deploy-status-title {
        font-size: 40px;
    }

    .deploy-progress {
        margin-top: 28px;
    }

    .deploy-progress-ready {
        margin-top: 18px;
    }

    .deploy-log {
        padding-bottom: 18px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .deploy-stage-spinner,
    .deploy-stage-spinner-arc,
    .deploy-progress-fill::after,
    .deploy-log-live {
        animation-duration: 6s;
    }
}

</style>
</head>

                <path fill="#0078d4" d="M71.175 60.261h-41.29a1.911 1.911 0 0 0-1.305 3.309l26.532 24.764a4.171 4.171 0 0 0 2.846 1.121h23.38z"/>
                <path fill="url(#deploy-azure-gradient-shadow)" d="M33.338 6.544a4.118 4.118 0 0 0-3.943 2.879L4.252 83.917a4.14 4.14 0 0 0 3.908 5.538h20.787a4.443 4.443 0 0 0 3.41-2.9l5.014-14.777 17.910 16.705a4.237 4.237 0 0 0 2.666.972H81.24L71.024 60.261l-29.781.007L59.47 6.544z"/>
                <path fill="url(#deploy-azure-gradient-right)" d="M66.595 9.364a4.145 4.145 0 0 0-3.928-2.82H33.648a4.146 4.146 0 0 1 3.928 2.82l25.184 74.62a4.146 4.146 0 0 1-3.928 5.472h29.02a4.146 4.146 0 0 0 3.927-5.472z"/>
            </svg>
        </div>
        <div class="deploy-header-host"><span id="deploy-host-name"></span><span class="deploy-header-host-port">:8184</span></div>
    </header>

    <main class="deploy-main">

        <section class="deploy-status">
            <div class="deploy-status-step">
                <span id="deploy-step-current">1</span>
                <span class="deploy-status-step-separator">/</span>
                <span class="deploy-status-step-total" id="deploy-step-total">1</span>
            </div>
            <h1 class="deploy-status-title" id="deploy-title" aria-live="polite"></h1>
            <div class="deploy-status-detail" id="deploy-detail"></div>
            <div class="deploy-progress" id="deploy-progress"></div>
            <div class="deploy-progress-ready" id="deploy-progress-ready"></div>
            <div class="deploy-progress-meta">
                <span class="deploy-progress-percent" id="deploy-percent">0%</span>
                <span class="deploy-progress-elapsed" id="deploy-elapsed">00:00</span>
            </div>
        </section>

        <ol class="deploy-stages" id="deploy-stages"></ol>

    </main>

    <section class="deploy-log">
        <div class="deploy-log-panel">
            <div class="deploy-log-header">
                <span class="deploy-log-live"></span>
                <span id="deploy-log-source"></span>
                <button class="deploy-log-copy" id="deploy-log-copy" type="button">Copy</button>
            </div>
            <div class="deploy-log-lines" id="deploy-log-lines"></div>
        </div>
    </section>

</div>

<script src="/zato-deploy/vendor/tippy/popperjs.core.js"></script>
<script src="/zato-deploy/vendor/tippy/tippy.js"></script>
<script>

var zatoDeploy = {};

zatoDeploy.config = {
    progressUrl: '/zato-deploy/progress.json',
    dashboardPath: '/',
    pollIntervalMs: 1000,
    handoffPollIntervalMs: 200,
    estimateCap: 0.92,
    logLinesKept: 120,
    logLinesAnimated: 3,
    logScrollStickiness: 40,
    titleFailed: 'Deployment failed',
    redirectLabel: 'Redirecting to Zato in ',
    readyLabel: 'Environment ready',
    redirectSteps: 3,
    redirectStepMs: 700,
    copiedLabel: 'Copied to clipboard',
    copiedShownMs: 600,
    copiedPlacement: 'left',
    copiedOffset: [0, 10],
    tooltipTheme: 'zato-deploy',
    svgNamespace: 'http://www.w3.org/2000/svg',
};

zatoDeploy.state = {
    phase: 'running',
    stagesBuilt: false,
    lastLogId: 0,
    logLines: [],
    title: '',
    timer: null,
};

zatoDeploy.elements = {};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.init = function() {

    var elements = zatoDeploy.elements;

    elements.hostName = document.getElementById('deploy-host-name');
    elements.stepCurrent = document.getElementById('deploy-step-current');
    elements.stepTotal = document.getElementById('deploy-step-total');
    elements.title = document.getElementById('deploy-title');
    elements.detail = document.getElementById('deploy-detail');
    elements.progress = document.getElementById('deploy-progress');
    elements.progressReady = document.getElementById('deploy-progress-ready');
    elements.percent = document.getElementById('deploy-percent');
    elements.elapsed = document.getElementById('deploy-elapsed');
    elements.stages = document.getElementById('deploy-stages');
    elements.logSource = document.getElementById('deploy-log-source');
    elements.logLines = document.getElementById('deploy-log-lines');
    elements.logCopy = document.getElementById('deploy-log-copy');
    elements.stageRows = [];
    elements.progressFills = [];
    elements.progressSegments = [];

    elements.progressReady.textContent = zatoDeploy.config.readyLabel;
    elements.logCopy.addEventListener('click', zatoDeploy.copyLog);

    elements.hostName.textContent = window.location.hostname;

    zatoDeploy.poll();
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.poll = function() {
    zatoDeploy.fetchProgress().then(function(snapshot) {
        if(snapshot === null) {
            zatoDeploy.redirect();
            return;
        }
        zatoDeploy.render(snapshot);
        zatoDeploy.scheduleNext();
    }, function() {
        zatoDeploy.scheduleNext();
    });
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.scheduleNext = function() {

    var config = zatoDeploy.config;
    var phase = zatoDeploy.state.phase;

    if(phase === 'failed') {
        return;
    }

    if(phase === 'ready') {
        zatoDeploy.showRedirectStep(config.redirectSteps);
        return;
    }

    zatoDeploy.state.timer = setTimeout(zatoDeploy.poll, config.pollIntervalMs);
};

// ////////////////////////////////////////////////////////////////////////

// The Dashboard answers in place of the progress once the deployment is over, which resolves to null.
zatoDeploy.fetchProgress = function() {

    var url = zatoDeploy.config.progressUrl + '?after=' + zatoDeploy.state.lastLogId;

    return fetch(url, {cache: 'no-store'}).then(function(response) {
        if(!zatoDeploy.isProgressResponse(response)) {
            return null;
        }
        return response.json();
    });
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.isProgressResponse = function(response) {

    if(!response.ok) {
        return false;
    }

    if(response.redirected) {
        return false;
    }

    var contentType = response.headers.get('content-type');

    if(contentType === null) {
        return false;
    }

    return contentType.indexOf('application/json') === 0;
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.pollHandoff = function() {

    var config = zatoDeploy.config;

    zatoDeploy.isDashboardAnswering().then(function(isDashboard) {
        if(isDashboard) {
            zatoDeploy.redirect();
            return;
        }
        zatoDeploy.state.timer = setTimeout(zatoDeploy.pollHandoff, config.handoffPollIntervalMs);
    }, function() {
        zatoDeploy.state.timer = setTimeout(zatoDeploy.pollHandoff, config.handoffPollIntervalMs);
    });
};

// ////////////////////////////////////////////////////////////////////////

// Once the deployment server exits, the same address answers with the Dashboard,
// which never returns this JSON, so any other answer means the handoff took place.
zatoDeploy.isDashboardAnswering = function() {
    return fetch(zatoDeploy.config.progressUrl, {cache: 'no-store'}).then(function(response) {
        return !zatoDeploy.isProgressResponse(response);
    });
};

// ////////////////////////////////////////////////////////////////////////

// Each step reads as a second on screen, but the whole countdown is shorter than it says.
zatoDeploy.showRedirectStep = function(stepsLeft) {

    var config = zatoDeploy.config;

    // The Dashboard has taken over the port by now, so the check at the end succeeds at once.
    if(stepsLeft === 0) {
        zatoDeploy.pollHandoff();
        return;
    }

    zatoDeploy.setDetails([]);
    zatoDeploy.setTitle(config.redirectLabel + stepsLeft + 's', true);

    zatoDeploy.state.timer = setTimeout(function() {
        zatoDeploy.showRedirectStep(stepsLeft - 1);
    }, config.redirectStepMs);
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.redirect = function() {
    window.location.replace(zatoDeploy.config.dashboardPath);
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.render = function(snapshot) {

    if(!zatoDeploy.state.stagesBuilt) {
        zatoDeploy.buildStages(snapshot.stages);
    }

    zatoDeploy.updatePhase(snapshot);

    var current = zatoDeploy.getCurrentStage(snapshot);

    zatoDeploy.renderStatus(snapshot, current);
    zatoDeploy.renderStages(snapshot);
    zatoDeploy.renderProgress(snapshot);
    zatoDeploy.renderLog(snapshot.log);
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.updatePhase = function(snapshot) {

    var phase = 'running';

    if(snapshot.failure !== null) {
        phase = 'failed';
    }
    else if(snapshot.is_ready) {
        phase = 'ready';
    }

    zatoDeploy.state.phase = phase;
    document.body.setAttribute('data-state', phase);
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.getCurrentStage = function(snapshot) {

    var stages = snapshot.stages;

    for(var stageIndex = 0; stageIndex < stages.length; stageIndex++) {
        var status = stages[stageIndex].status;
        if(status === 'active' || status === 'failed') {
            return {stage: stages[stageIndex], index: stageIndex};
        }
    }

    if(snapshot.is_ready) {
        return {stage: stages[stages.length - 1], index: stages.length - 1};
    }

    return {stage: stages[0], index: 0};
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.buildStages = function(stages) {

    var elements = zatoDeploy.elements;

    for(var stageIndex = 0; stageIndex < stages.length; stageIndex++) {

        var stage = stages[stageIndex];

        // Build the row in the stage list ..
        var row = document.createElement('li');
        row.className = 'deploy-stage';
        row.setAttribute('data-status', stage.status);

        var marker = zatoDeploy.createMarker();

        var index = document.createElement('span');
        index.className = 'deploy-stage-index';
        index.textContent = zatoDeploy.padNumber(stageIndex + 1);

        var name = document.createElement('span');
        name.className = 'deploy-stage-name';
        name.textContent = stage.name;

        var time = document.createElement('span');
        time.className = 'deploy-stage-time';

        row.appendChild(marker);
        row.appendChild(index);
        row.appendChild(name);
        row.appendChild(time);
        elements.stages.appendChild(row);

        // .. the components the stage starts, if it starts any ..
        var components = null;

        if(stage.components !== null) {
            row.setAttribute('data-has-components', 'true');
            components = zatoDeploy.buildComponents(stage.components);
            elements.stages.appendChild(components.container);
        }

        elements.stageRows.push({row: row, time: time, components: components});

        // .. and its segment in the progress bar, as wide as the share of time the stage is expected to take.
        var segment = document.createElement('div');
        segment.className = 'deploy-progress-segment';
        segment.style.flexGrow = stage.weight;

        var fill = document.createElement('div');
        fill.className = 'deploy-progress-fill';

        segment.appendChild(fill);
        elements.progress.appendChild(segment);
        elements.progressSegments.push(segment);
        elements.progressFills.push(fill);
    }

    elements.stepTotal.textContent = stages.length;
    zatoDeploy.state.stagesBuilt = true;
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.buildComponents = function(components) {

    var container = document.createElement('li');
    container.className = 'deploy-components';

    var items = [];

    for(var componentIndex = 0; componentIndex < components.length; componentIndex++) {

        var item = document.createElement('div');
        item.className = 'deploy-component';
        item.setAttribute('data-status', components[componentIndex].status);

        var name = document.createElement('span');
        name.className = 'deploy-component-name';
        name.textContent = components[componentIndex].name;

        item.appendChild(zatoDeploy.createMarker());
        item.appendChild(name);
        container.appendChild(item);
        items.push(item);
    }

    return {container: container, items: items};
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.createMarker = function() {

    var marker = document.createElement('span');
    marker.className = 'deploy-stage-marker';

    marker.appendChild(zatoDeploy.createSpinner());
    marker.appendChild(zatoDeploy.createIcon('deploy-stage-marker-done', 'polyline', 'points', '4 12.5 9.5 18 20 6.5'));
    marker.appendChild(zatoDeploy.createIcon('deploy-stage-marker-failed', 'path', 'd', 'M6 6 L18 18 M18 6 L6 18'));

    return marker;
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.createSpinner = function() {

    var namespace = zatoDeploy.config.svgNamespace;

    var spinner = document.createElementNS(namespace, 'svg');
    spinner.setAttribute('class', 'deploy-stage-spinner');
    spinner.setAttribute('viewBox', '0 0 50 50');

    var track = document.createElementNS(namespace, 'circle');
    track.setAttribute('class', 'deploy-stage-spinner-track');
    track.setAttribute('cx', '25');
    track.setAttribute('cy', '25');
    track.setAttribute('r', '20');

    var arc = document.createElementNS(namespace, 'circle');
    arc.setAttribute('class', 'deploy-stage-spinner-arc');
    arc.setAttribute('cx', '25');
    arc.setAttribute('cy', '25');
    arc.setAttribute('r', '20');

    spinner.appendChild(track);
    spinner.appendChild(arc);
    return spinner;
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.createIcon = function(className, shapeName, attributeName, attributeValue) {

    var namespace = zatoDeploy.config.svgNamespace;

    var icon = document.createElementNS(namespace, 'svg');
    icon.setAttribute('class', 'deploy-stage-marker-icon ' + className);
    icon.setAttribute('viewBox', '0 0 24 24');

    var shape = document.createElementNS(namespace, shapeName);
    shape.setAttribute(attributeName, attributeValue);

    icon.appendChild(shape);
    return icon;
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.renderStatus = function(snapshot, current) {

    var elements = zatoDeploy.elements;
    var config = zatoDeploy.config;
    var phase = zatoDeploy.state.phase;
    var total = snapshot.stages.length;
    var stepNumber = current.index + 1;
    var title = current.stage.name;
    var details = [];

    if(phase === 'failed') {
        title = config.titleFailed;
        details.push({text: snapshot.failure.message, kind: 'error'});
        details.push({text: snapshot.ssh_command, kind: 'command'});
    }
    else if(phase === 'ready') {
        title = config.redirectLabel + config.redirectSteps + 's';
    }
    else {
        details = zatoDeploy.getStageDetails(current.stage, snapshot.now);
    }

    elements.stepCurrent.textContent = stepNumber;
    zatoDeploy.setTitle(title);
    zatoDeploy.setDetails(details);

    document.title = stepNumber + ' / ' + total + ' - ' + title;
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.getStageDetails = function(stage, now) {

    var out = [];
    var progress = stage.progress;

    if(stage.components !== null) {
        out.push({text: zatoDeploy.countDone(stage.components) + ' / ' + stage.components.length, kind: null});
    }

    if(progress === null) {
        out.push({text: zatoDeploy.formatDuration(now - stage.started), kind: null});
    }
    else {
        out.push({text: progress.current.toFixed(1) + ' / ' + progress.total.toFixed(1) + ' ' + progress.unit, kind: null});
        if(progress.rate !== null) {
            out.push({text: progress.rate.toFixed(1) + ' ' + progress.unit + '/s', kind: null});
        }
    }

    if(stage.detail !== null) {
        out.push({text: stage.detail, kind: null});
    }

    return out;
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.countDone = function(items) {

    var out = 0;

    for(var itemIndex = 0; itemIndex < items.length; itemIndex++) {
        if(items[itemIndex].status === 'done') {
            out += 1;
        }
    }

    return out;
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.setTitle = function(title, isStill) {

    if(title === zatoDeploy.state.title) {
        return;
    }

    var element = zatoDeploy.elements.title;

    element.textContent = title;
    zatoDeploy.state.title = title;

    if(isStill) {
        return;
    }

    element.animate([
        {opacity: 0, transform: 'translateY(10px)'},
        {opacity: 1, transform: 'none'}
    ], {duration: 420, easing: 'cubic-bezier(0.2, 0.7, 0.2, 1)'});
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.setDetails = function(details) {

    var container = zatoDeploy.elements.detail;
    container.replaceChildren();

    for(var detailIndex = 0; detailIndex < details.length; detailIndex++) {
        var detail = details[detailIndex];
        var item = document.createElement('span');
        item.className = 'deploy-status-detail-item';
        item.textContent = detail.text;
        if(detail.kind !== null) {
            item.setAttribute('data-kind', detail.kind);
        }
        container.appendChild(item);
    }
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.renderStages = function(snapshot) {

    var rows = zatoDeploy.elements.stageRows;

    for(var stageIndex = 0; stageIndex < snapshot.stages.length; stageIndex++) {

        var stage = snapshot.stages[stageIndex];
        var entry = rows[stageIndex];
        var timeText = '';

        if(stage.status === 'done' || stage.status === 'failed') {
            timeText = zatoDeploy.formatDuration(stage.finished - stage.started);
        }
        else if(stage.status === 'active') {
            timeText = zatoDeploy.formatDuration(snapshot.now - stage.started);
        }

        entry.row.setAttribute('data-status', stage.status);
        entry.time.textContent = timeText;

        if(entry.components !== null) {

            // Components that never started leave the list once the container is ready.
            if(entry.components.items.length !== stage.components.length) {
                var rebuilt = zatoDeploy.buildComponents(stage.components);
                entry.components.container.replaceWith(rebuilt.container);
                entry.components = rebuilt;
            }

            entry.components.container.setAttribute('data-status', stage.status);
            for(var componentIndex = 0; componentIndex < stage.components.length; componentIndex++) {
                entry.components.items[componentIndex].setAttribute('data-status', stage.components[componentIndex].status);
            }
        }
    }
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.getStageFraction = function(stage, now) {

    if(stage.status === 'done') {
        return 1;
    }

    if(stage.status === 'pending') {
        return 0;
    }

    if(stage.fraction !== null) {
        return stage.fraction;
    }

    var end = stage.status === 'failed' ? stage.finished : now;
    return Math.min((end - stage.started) / stage.weight, zatoDeploy.config.estimateCap);
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.renderProgress = function(snapshot) {

    var elements = zatoDeploy.elements;
    var stages = snapshot.stages;
    var totalWeight = 0;
    var doneWeight = 0;

    for(var stageIndex = 0; stageIndex < stages.length; stageIndex++) {

        var stage = stages[stageIndex];
        var fraction = zatoDeploy.getStageFraction(stage, snapshot.now);

        totalWeight += stage.weight;
        doneWeight += stage.weight * fraction;

        elements.progressSegments[stageIndex].setAttribute('data-status', stage.status);
        elements.progressFills[stageIndex].style.width = (fraction * 100) + '%';
    }

    var percent = snapshot.is_ready ? 100 : Math.floor(doneWeight / totalWeight * 100);
    var lastStage = stages[stages.length - 1];
    var end = snapshot.is_ready ? lastStage.finished : snapshot.now;

    elements.percent.textContent = percent + '%';
    elements.elapsed.textContent = zatoDeploy.formatClock(end - snapshot.started);
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.renderLog = function(log) {

    var config = zatoDeploy.config;
    var state = zatoDeploy.state;
    var container = zatoDeploy.elements.logLines;
    var lines = log.lines;

    zatoDeploy.elements.logSource.textContent = log.source;

    // Each poll returns only the lines after the last one already shown.
    if(lines.length === 0) {
        return;
    }

    var distanceFromBottom = container.scrollHeight - container.scrollTop - container.clientHeight;
    var isFollowing = distanceFromBottom < config.logScrollStickiness;
    var isAnimated = lines.length <= config.logLinesAnimated;

    for(var lineIndex = 0; lineIndex < lines.length; lineIndex++) {

        var line = lines[lineIndex];
        state.logLines.push(line);

        var row = document.createElement('div');
        row.className = 'deploy-log-line';
        if(line.kind !== null) {
            row.setAttribute('data-kind', line.kind);
        }

        var time = document.createElement('span');
        time.className = 'deploy-log-line-time';
        time.textContent = zatoDeploy.formatTime(line.time);

        var text = document.createElement('span');
        text.className = 'deploy-log-line-text';
        text.textContent = line.text;

        row.appendChild(time);
        row.appendChild(text);
        container.appendChild(row);

        if(isAnimated) {
            row.animate([
                {opacity: 0, transform: 'translateY(6px)'},
                {opacity: 1, transform: 'none'}
            ], {duration: 300, easing: 'ease-out'});
        }
    }

    while(container.childElementCount > config.logLinesKept) {
        container.firstElementChild.remove();
    }

    if(isFollowing) {
        container.scrollTop = container.scrollHeight;
    }

    state.lastLogId = lines[lines.length - 1].id;
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.copyLog = function() {

    var lines = zatoDeploy.state.logLines;
    var text = [];

    for(var lineIndex = 0; lineIndex < lines.length; lineIndex++) {
        text.push(zatoDeploy.formatTime(lines[lineIndex].time) + '  ' + lines[lineIndex].text);
    }

    navigator.clipboard.writeText(text.join('\n')).then(zatoDeploy.confirmCopied);
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.confirmCopied = function() {

    var config = zatoDeploy.config;
    var button = zatoDeploy.elements.logCopy;

    // One element holds one tooltip at a time, and the one from a moment ago may still be on screen.
    if(button._tippy) {
        button._tippy.destroy();
    }

    var tooltip = tippy(button, {
        content: config.copiedLabel,
        placement: config.copiedPlacement,
        offset: config.copiedOffset,
        theme: config.tooltipTheme,
        trigger: 'manual',
        arrow: true,
        appendTo: document.body
    });

    tooltip.show();

    setTimeout(function() {
        tooltip.destroy();
    }, config.copiedShownMs);
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.padNumber = function(value) {
    return value < 10 ? '0' + value : '' + value;
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.formatDuration = function(seconds) {
    var whole = Math.max(0, Math.floor(seconds));
    return Math.floor(whole / 60) + ':' + zatoDeploy.padNumber(whole % 60);
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.formatClock = function(seconds) {
    var whole = Math.max(0, Math.floor(seconds));
    return zatoDeploy.padNumber(Math.floor(whole / 60)) + ':' + zatoDeploy.padNumber(whole % 60);
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.formatTime = function(epochSeconds) {
    var date = new Date(epochSeconds * 1000);
    var padNumber = zatoDeploy.padNumber;
    return padNumber(date.getHours()) + ':' + padNumber(date.getMinutes()) + ':' + padNumber(date.getSeconds());
};

// ////////////////////////////////////////////////////////////////////////

zatoDeploy.init();

</script>
</body>
