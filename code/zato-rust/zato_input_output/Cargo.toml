[package]
name = "zato_input_output"
version = "4.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "I/O serialization layer for Zato - API, ESB, SOA, iPaaS, integration platform, middleware, rule engine"
repository = "https://github.com/zatosource/zato"
readme = "README.md"
keywords = ["zato", "api", "integration-platform", "ipaas", "rule-engine"]
categories = ["development-tools"]

[lib]
name = "zato_input_output"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
indexmap = "2.14.0"
pyo3 = "0.29.2"

[dev-dependencies]
pyo3 = { version = "0.29.2", features = ["auto-initialize"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true
