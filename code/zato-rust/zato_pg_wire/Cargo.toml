[package]
name = "zato_pg_wire"
version = "4.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Decoding of PostgreSQL wire protocol rows for the Zato connections to PostgreSQL - API, ESB, SOA, iPaaS, integration platform, middleware, rule engine"
repository = "https://github.com/zatosource/zato"
readme = "README.md"
keywords = ["zato", "api", "integration-platform", "ipaas", "rule-engine"]
categories = ["development-tools"]

[lib]
name = "zato_pg_wire"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module"] }
chrono = { version = "0.4.44", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
incremental = false
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
overflow-checks = true
