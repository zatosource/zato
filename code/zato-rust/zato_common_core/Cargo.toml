[package]
name = "zato_common_core"
version = "4.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Core utilities shared across all Zato Rust crates - API, ESB, SOA, iPaaS, integration platform, middleware, rule engine"
repository = "https://github.com/zatosource/zato"
readme = "README.md"
keywords = ["zato", "api", "integration-platform", "ipaas", "rule-engine"]
categories = ["development-tools"]

[lib]
name = "zato_common_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module"] }
chrono = "0.4.44"
foldhash = "0.2.0"
serde = "1.0.228"
serde_json = { version = "1.0.149", features = ["raw_value"] }
blake2 = "0.11.0"
rusqlite = "0.41.1"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib"] }

[dev-dependencies]
proptest = "1.11.0"

[lints.rust]
unsafe_code = "deny"

[profile.dev]
incremental = false
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
overflow-checks = true
