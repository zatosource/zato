security:

  - name: test.durability.power-loss.publisher
    type: basic_auth
    username: test.durability.power-loss.publisher
    password: "{{publisher_password}}"

  - name: test.durability.power-loss.puller
    type: basic_auth
    username: test.durability.power-loss.puller
    password: "{{puller_password}}"

  - name: test.durability.power-loss.caller
    type: basic_auth
    username: test.durability.power-loss.caller
    password: "{{caller_password}}"

pubsub_topic:

  - name: durability.power-loss

pubsub_permission:

  - security: test.durability.power-loss.publisher
    pub:
      - durability.power-loss

  - security: test.durability.power-loss.puller
    sub:
      - durability.power-loss

pubsub_subscription:

  - security: test.durability.power-loss.puller
    delivery_type: pull
    topic_list:
      - durability.power-loss

channel_rest:

  - name: test.durability.power-loss.audited
    service: test.durability.power-loss.echo
    url_path: /test/durability/power-loss/audited
    data_format: json
    is_audit_log_active: true
