services:

  db:
    image: mariadb:10.5
    command: "mysqld --character-set-server=utf8 --collation-server=utf8_general_ci --max_allowed_packet=64M"
    environment:
      MYSQL_ROOT_PASSWORD: "${OSCAR_PASSWORD}"
      TZ: UTC
    ports:
      - "${OSCAR_MARIADB_PORT}:3306"
    volumes:
      - "${OSCAR_SCRIPTS_DIR}:/oscar-mysql-scripts"

  oscar:
    image: openosp/open-osp:2026.09.17
    depends_on:
      - db
    environment:
      TZ: UTC
      CATALINA_OPTS: -Djava.awt.headless=true
      JAVA_OPTS: -Dlog4j2.formatMsgNoLookups=true -Xmx2G -Xms1G -Dorg.apache.el.parser.COERCE_TO_ZERO=true
    ports:
      - "${OSCAR_WEB_PORT}:8080"
    volumes:
      - "${OSCAR_CONFIG_DIR}/oscar.properties:/root/oscar.properties"
      - "${OSCAR_CONFIG_DIR}/drugref2.properties:/root/drugref2.properties"
      - documents:/var/lib/OscarDocument
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  documents:
