services:

  mongo:
    image: mongo:4.4

  openhim:
    image: jembi/openhim-core@sha256:8d72295b598b7171bd95268f0421e2a4a198983be4f5e18c0cddeb12ca20ecce
    depends_on:
      - mongo
    environment:
      mongo_url: "mongodb://mongo/openhim"
      mongo_atnaUrl: "mongodb://mongo/openhim"
      NODE_ENV: "development"
    ports:
      - "${OPENHIM_API_PORT}:8080"
      - "${OPENHIM_ROUTER_HTTPS_PORT}:5000"
      - "${OPENHIM_ROUTER_HTTP_PORT}:5001"
      - "${OPENHIM_CHANNEL_1_PORT}:6001"
      - "${OPENHIM_CHANNEL_2_PORT}:6002"
      - "${OPENHIM_CHANNEL_3_PORT}:6003"
      - "${OPENHIM_CHANNEL_4_PORT}:6004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
