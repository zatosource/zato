security:

  - name: test.reliability.power-loss.publisher
    type: basic_auth
    username: test.reliability.power-loss.publisher
    password: "{{publisher_password}}"

  - name: test.reliability.power-loss.puller
    type: basic_auth
    username: test.reliability.power-loss.puller
    password: "{{puller_password}}"

  - name: test.reliability.power-loss.caller
    type: basic_auth
    username: test.reliability.power-loss.caller
    password: "{{caller_password}}"

  - name: test.reliability.power-loss.receipt-reader
    type: basic_auth
    username: test.reliability.power-loss.receipt-reader
    password: "{{receipt_reader_password}}"

  - name: test.reliability.power-loss.pusher
    type: basic_auth
    username: test.reliability.power-loss.pusher
    password: "{{pusher_password}}"

outgoing_rest:

  - name: test.reliability.power-loss.out.push
    host: "http://127.0.0.1:{{push_port}}"
    url_path: /webhook/power-loss
    data_format: json
    timeout: 30

pubsub_topic:

  - name: reliability.power-loss
  - name: reliability.power-loss.receipts
  - name: reliability.power-loss.pushed

pubsub_permission:

  - security: test.reliability.power-loss.publisher
    pub:
      - reliability.power-loss
      - reliability.power-loss.pushed

  - security: test.reliability.power-loss.puller
    pub:
      - reliability.power-loss.receipts
    sub:
      - reliability.power-loss

  - security: test.reliability.power-loss.receipt-reader
    sub:
      - reliability.power-loss.receipts

  - security: test.reliability.power-loss.pusher
    sub:
      - reliability.power-loss.pushed

pubsub_subscription:

  - security: test.reliability.power-loss.puller
    delivery_type: pull
    topic_list:
      - reliability.power-loss

  - security: test.reliability.power-loss.receipt-reader
    delivery_type: pull
    topic_list:
      - reliability.power-loss.receipts

  - security: test.reliability.power-loss.pusher
    delivery_type: push
    push_rest_endpoint: test.reliability.power-loss.out.push
    topic_list:
      - reliability.power-loss.pushed

channel_rest:

  - name: test.reliability.power-loss.audited
    service: test.reliability.power-loss.echo
    url_path: /test/reliability/power-loss/audited
    data_format: json
    is_audit_log_active: true
