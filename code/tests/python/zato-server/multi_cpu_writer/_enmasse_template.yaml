security:

  # One pull subscriber per test, each with a password of the run
  - name: test.multi-cpu.writer.one-a
    type: basic_auth
    username: test.multi-cpu.writer.one-a
    password: "{{sec_password}}"
  - name: test.multi-cpu.writer.one-b
    type: basic_auth
    username: test.multi-cpu.writer.one-b
    password: "{{sec_password}}"
  - name: test.multi-cpu.writer.many
    type: basic_auth
    username: test.multi-cpu.writer.many
    password: "{{sec_password}}"
  - name: test.multi-cpu.writer.kill
    type: basic_auth
    username: test.multi-cpu.writer.kill
    password: "{{sec_password}}"
  - name: test.multi-cpu.writer.duplicate
    type: basic_auth
    username: test.multi-cpu.writer.duplicate
    password: "{{sec_password}}"
  - name: test.multi-cpu.writer.browse
    type: basic_auth
    username: test.multi-cpu.writer.browse
    password: "{{sec_password}}"

channel_rest:

  # The slot of the worker that serves a request, through which a test reaches the worker of a given slot
  - name: test.multi-cpu.worker-slot
    service: test.multi-cpu.worker-slot
    url_path: /test/multi-cpu/worker-slot
    data_format: json

  # A publication under the message ID and with the priority that the test gives
  - name: test.multi-cpu.publish-with-id
    service: test.multi-cpu.publish-with-id
    url_path: /test/multi-cpu/publish-with-id
    data_format: json

pubsub_topic:

  - name: multi.cpu.writer.one
  - name: multi.cpu.writer.many.00
  - name: multi.cpu.writer.many.01
  - name: multi.cpu.writer.many.02
  - name: multi.cpu.writer.many.03
  - name: multi.cpu.writer.many.04
  - name: multi.cpu.writer.many.05
  - name: multi.cpu.writer.many.06
  - name: multi.cpu.writer.many.07
  - name: multi.cpu.writer.many.08
  - name: multi.cpu.writer.many.09
  - name: multi.cpu.writer.kill
  - name: multi.cpu.writer.duplicate
  - name: multi.cpu.writer.browse

pubsub_permission:

  - security: test.multi-cpu.writer.one-a
    sub:
      - multi.cpu.writer.one
  - security: test.multi-cpu.writer.one-b
    sub:
      - multi.cpu.writer.one
  - security: test.multi-cpu.writer.many
    sub:
      - multi.cpu.writer.many.00
      - multi.cpu.writer.many.01
      - multi.cpu.writer.many.02
      - multi.cpu.writer.many.03
      - multi.cpu.writer.many.04
      - multi.cpu.writer.many.05
      - multi.cpu.writer.many.06
      - multi.cpu.writer.many.07
      - multi.cpu.writer.many.08
      - multi.cpu.writer.many.09
  - security: test.multi-cpu.writer.kill
    sub:
      - multi.cpu.writer.kill
  - security: test.multi-cpu.writer.duplicate
    sub:
      - multi.cpu.writer.duplicate
  - security: test.multi-cpu.writer.browse
    sub:
      - multi.cpu.writer.browse

pubsub_subscription:

  - security: test.multi-cpu.writer.one-a
    delivery_type: pull
    topic_list:
      - multi.cpu.writer.one
  - security: test.multi-cpu.writer.one-b
    delivery_type: pull
    topic_list:
      - multi.cpu.writer.one
  - security: test.multi-cpu.writer.many
    delivery_type: pull
    topic_list:
      - multi.cpu.writer.many.00
      - multi.cpu.writer.many.01
      - multi.cpu.writer.many.02
      - multi.cpu.writer.many.03
      - multi.cpu.writer.many.04
      - multi.cpu.writer.many.05
      - multi.cpu.writer.many.06
      - multi.cpu.writer.many.07
      - multi.cpu.writer.many.08
      - multi.cpu.writer.many.09
  - security: test.multi-cpu.writer.kill
    delivery_type: pull
    topic_list:
      - multi.cpu.writer.kill
  - security: test.multi-cpu.writer.duplicate
    delivery_type: pull
    topic_list:
      - multi.cpu.writer.duplicate
  - security: test.multi-cpu.writer.browse
    delivery_type: pull
    topic_list:
      - multi.cpu.writer.browse
