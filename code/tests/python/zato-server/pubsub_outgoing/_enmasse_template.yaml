security:

  - name: test.outgoing.credentials
    type: basic_auth
    username: test.outgoing.api
    password: "{{connection_password}}"

outgoing_rest:

  # The two connections whose messages the tests have the endpoint refuse for a while keep such a message at the head
  # of the queue until it is accepted, which is what the DLQ switch off means - with it on, the default, a message
  # whose attempts ran out would move to the connection's DLQ instead
  - name: test.outgoing.orders
    host: "http://127.0.0.1:{{port_orders}}"
    url_path: /api/orders
    data_format: json
    timeout: 30
    request_method: POST
    use_dlq: false

  - name: test.outgoing.to-rename
    host: "http://127.0.0.1:{{port_rename}}"
    url_path: /api/rename
    data_format: json
    timeout: 30
    request_method: POST
    use_dlq: false

  - name: test.outgoing.to-delete
    host: "http://127.0.0.1:{{port_delete}}"
    url_path: /api/delete
    data_format: json
    timeout: 30
    request_method: POST

  - name: test.outgoing.inventory
    host: "http://127.0.0.1:{{port_inventory}}"
    url_path: /api/inventory/items
    data_format: json
    timeout: 30
    security: test.outgoing.credentials
    request_method: PUT
    request_query_string:
      - key: status
        value: active
        mode: text
    request_headers:
      - key: X-Sync-Source
        value: daily-sync
        mode: text

  # This one shares its name with a FHIR connection, which is what proves that a publication
  # goes to the connection of the type it was published to rather than to whichever one answers to the name
  - name: test.outgoing.shared
    host: "http://127.0.0.1:{{port_shared_rest}}"
    url_path: /api/shared
    data_format: json
    timeout: 30
    request_method: POST

outgoing_fhir:

  # The DLQ switch is off for the same reason as with the two REST connections above - the tests have this one's
  # endpoint refuse a document and go down for a restart, and the document has to stay in the queue through both
  - name: test.outgoing.fhir
    address: "http://127.0.0.1:{{port_fhir}}/fhir/r4"
    use_dlq: false

  - name: test.outgoing.fhir-secured
    address: "http://127.0.0.1:{{port_fhir_secured}}/fhir/r4"
    security: test.outgoing.credentials

  - name: test.outgoing.shared
    address: "http://127.0.0.1:{{port_shared_fhir}}/fhir/r4"
