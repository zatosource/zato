# Three Consul servers, one per zone, with ACLs and TLS. The configuration, with the initial management token,
# is the Secret consul-config, and the certificates are the Secret consul-tls.

apiVersion: v1
kind: Service
metadata:
  name: consul
  namespace: ${namespace}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: consul
  ports:
    - name: server
      port: 8300
    - name: serf-lan
      port: 8301
    - name: https
      port: 8501
---
apiVersion: v1
kind: Service
metadata:
  name: consul-api
  namespace: ${namespace}
spec:
  type: NodePort
  selector:
    app: consul
  ports:
    - name: https
      port: 8501
      targetPort: 8501
      nodePort: ${consul_node_port}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: consul
  namespace: ${namespace}
spec:
  serviceName: consul
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: consul
  template:
    metadata:
      labels:
        app: consul
    spec:
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: consul
      containers:
        - name: consul
          image: ${consul_image}
          imagePullPolicy: Never
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          args:
            - agent
            - -config-dir=/consul/config
            - -node=$(POD_NAME)
            - -advertise=$(POD_IP)
          ports:
            - name: server
              containerPort: 8300
            - name: serf-lan
              containerPort: 8301
            - name: https
              containerPort: 8501
          readinessProbe:
            tcpSocket:
              port: 8501
            periodSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /consul/config
              readOnly: true
            - name: tls
              mountPath: /consul/certs
              readOnly: true
            - name: data
              mountPath: /consul/data
      volumes:
        - name: config
          secret:
            secretName: consul-config
        - name: tls
          secret:
            secretName: consul-tls
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
