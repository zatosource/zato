security:

  - name: test.exactly-once.publisher
    type: basic_auth
    username: test.exactly-once.publisher
    password: "{{publisher_password}}"

  - name: test.exactly-once.reader
    type: basic_auth
    username: test.exactly-once.reader
    password: "{{reader_password}}"

  - name: test.exactly-once.orders
    type: basic_auth
    username: test.exactly-once.orders
    password: "{{orders_password}}"

  - name: test.exactly-once.verifier
    type: basic_auth
    username: test.exactly-once.verifier
    password: "{{verifier_password}}"

pubsub_topic:

  - name: exactly-once.input
  - name: exactly-once.output
  - name: orders
  - name: invoices
  - name: audit

  - name: exactly-once.inactive
    is_active: false

pubsub_permission:

  - security: test.exactly-once.publisher
    pub:
      - exactly-once.input
      - orders

  - security: test.exactly-once.reader
    sub:
      - exactly-once.output

  - security: test.exactly-once.orders
    pub:
      - invoices
      - audit
      - exactly-once.inactive
    sub:
      - orders

  - security: test.exactly-once.verifier
    sub:
      - invoices
      - audit

pubsub_subscription:

  - delivery_type: push
    push_service: test.exactly-once.relay
    is_delivery_active: {{relay_delivery_active}}
    topic_list:
      - exactly-once.input

  - security: test.exactly-once.reader
    delivery_type: pull
    topic_list:
      - exactly-once.output

  - security: test.exactly-once.orders
    delivery_type: pull
    topic_list:
      - orders

  - security: test.exactly-once.verifier
    delivery_type: pull
    topic_list:
      - invoices
      - audit
