# The connections of the SMS suite - one outgoing connection per provider, each pointed at its simulator,
# with a webhook channel and a polling channel over each of them. Every address and credential is read from
# the environment the session fixture sets before the import.

outgoing_sms:

  - name: test.sms.out.twilio
    provider: twilio
    host: ${Zato_Test_SMS_Twilio_Host}
    username: ${Zato_Test_SMS_Twilio_Username}
    password: ${Zato_Test_SMS_Twilio_Password}
    sender: '+15005550006'
    channel_name: test.sms.in.twilio
    timeout: 2
    max_retries: 0

  - name: test.sms.out.vonage
    provider: vonage
    host: ${Zato_Test_SMS_Vonage_Host}
    username: ${Zato_Test_SMS_Vonage_Username}
    password: ${Zato_Test_SMS_Vonage_Password}
    signature_secret: ${Zato_Test_SMS_Vonage_Signature_Secret}
    sender: '12025550100'
    channel_name: test.sms.in.vonage
    timeout: 2
    max_retries: 0

  - name: test.sms.out.infobip
    provider: infobip
    host: ${Zato_Test_SMS_Infobip_Host}
    username: ${Zato_Test_SMS_Infobip_Username}
    password: ${Zato_Test_SMS_Infobip_Password}
    sender: ZatoSMS
    channel_name: test.sms.in.infobip
    timeout: 2
    max_retries: 0

  - name: test.sms.out.africas-talking
    provider: africas-talking
    host: ${Zato_Test_SMS_Africas_Talking_Host}
    username: ${Zato_Test_SMS_Africas_Talking_Username}
    password: ${Zato_Test_SMS_Africas_Talking_Password}
    sender: '+12025550100'
    channel_name: test.sms.in.africas-talking
    timeout: 2
    max_retries: 0

channel_sms:

  # The webhook channels - each provider's callbacks arrive at /zato/sms/<name>

  - name: test.sms.in.twilio
    outconn: test.sms.out.twilio
    service: test.sms.target

  - name: test.sms.in.vonage
    outconn: test.sms.out.vonage
    service: test.sms.target

  - name: test.sms.in.infobip
    outconn: test.sms.out.infobip
    service: test.sms.target

  - name: test.sms.in.africas-talking
    outconn: test.sms.out.africas-talking
    service: test.sms.target

  # The polling channels - the tests run their poll service directly rather than waiting for the scheduler

  - name: test.sms.poll.twilio
    outconn: test.sms.out.twilio
    service: test.sms.target
    receive_mode: polling
    scheduler_run_every: 1
    scheduler_run_unit: minutes

  - name: test.sms.poll.vonage
    outconn: test.sms.out.vonage
    service: test.sms.target
    receive_mode: polling
    scheduler_run_every: 1
    scheduler_run_unit: minutes

  - name: test.sms.poll.infobip
    outconn: test.sms.out.infobip
    service: test.sms.target
    receive_mode: polling
    scheduler_run_every: 1
    scheduler_run_unit: minutes

  - name: test.sms.poll.africas-talking
    outconn: test.sms.out.africas-talking
    service: test.sms.target
    receive_mode: polling
    scheduler_run_every: 1
    scheduler_run_unit: minutes
