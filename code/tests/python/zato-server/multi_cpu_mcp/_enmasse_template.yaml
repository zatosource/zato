security:

  # The definition through which the tests open and continue their MCP sessions
  - name: test.multi-cpu.mcp
    type: basic_auth
    username: test.multi-cpu.mcp
    password: "{{sec_password}}"

groups:

  - name: test.multi-cpu.mcp.group
    members:
      - test.multi-cpu.mcp

channel_rest:

  # The service that returns the slot of the worker that served the request
  - name: test.multi-cpu.mcp.worker-slot
    service: test.multi-cpu.worker-slot
    url_path: /test/multi-cpu/worker-slot
    data_format: json

mcp_gateway:

  # The gateway whose sessions the workers share
  - name: test.multi-cpu.mcp
    is_active: true
    url_path: /mcp/multi-cpu
    services:
      - test.multi-cpu.worker-slot
    security_groups:
      - test.multi-cpu.mcp.group
