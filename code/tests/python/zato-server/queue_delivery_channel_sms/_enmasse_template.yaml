# The connections of the SMS channel suite - one outgoing Twilio connection pointed at its simulator and the SMS channels
# the shared scenarios know by key, every one of them receiving by webhook over that connection. The address and the
# credentials of the simulator are read from the environment the session fixture sets before the import.

pubsub_topic:

  # Where the channel that forwards its DLQ messages sends them
  - name: test.queue-delivery.forwarded

outgoing_sms:

  - name: test.queue-delivery.sms.twilio
    provider: twilio
    host: ${Zato_Test_SMS_Twilio_Host}
    username: ${Zato_Test_SMS_Twilio_Username}
    password: ${Zato_Test_SMS_Twilio_Password}
    sender: '+15005550006'

channel_sms:

  # The switch off - the service runs as the callback arrives, nothing reaches a queue
  - name: test.queue-delivery.sms.plain
    outconn: test.queue-delivery.sms.twilio
    service: test.queue-delivery.channel.target

  # The switch on with a couple of quick retries and no DLQ - the channel most tests call, whose messages stay
  # at the head of the queue for as long as the service refuses them, which is what the ordering tests rely on
  - name: test.queue-delivery.sms.orders
    outconn: test.queue-delivery.sms.twilio
    service: test.queue-delivery.channel.target
    max_retries: 2
    retry_sleep_time: 1
    retry_backoff_threshold: 10
    retry_backoff_multiplier: 1
    use_queue: true
    use_dlq: false

  # The switch on and no retries at all - a message that fails once has exhausted them
  - name: test.queue-delivery.sms.no-retries
    outconn: test.queue-delivery.sms.twilio
    service: test.queue-delivery.channel.target
    max_retries: 0
    use_queue: true
    use_dlq: false

  # The switch on and the DLQ on with the rule leaving messages alone - a message that exhausted its retries
  # moves to the DLQ and stays there until someone acts on it
  - name: test.queue-delivery.sms.dlq-keep
    outconn: test.queue-delivery.sms.twilio
    service: test.queue-delivery.channel.target
    max_retries: 1
    retry_sleep_time: 1
    use_queue: true
    dlq_action: keep

  # The switch on and the DLQ off - a message that exhausted its retries stays at the head of the queue
  - name: test.queue-delivery.sms.no-dlq
    outconn: test.queue-delivery.sms.twilio
    service: test.queue-delivery.channel.target
    max_retries: 1
    retry_sleep_time: 1
    use_queue: true
    use_dlq: false

  # The DLQ rule puts a message back into the queue, a couple of times, quickly
  - name: test.queue-delivery.sms.dlq-retry
    outconn: test.queue-delivery.sms.twilio
    service: test.queue-delivery.channel.target
    max_retries: 1
    retry_sleep_time: 1
    use_queue: true
    dlq_action: retry
    dlq_retries: 2
    dlq_retry_interval: 1

  # The DLQ rule forwards a message to a topic, with its DLQ header
  - name: test.queue-delivery.sms.dlq-forward
    outconn: test.queue-delivery.sms.twilio
    service: test.queue-delivery.channel.target
    max_retries: 1
    retry_sleep_time: 1
    use_queue: true
    dlq_action: forward
    dlq_retry_interval: 1
    dlq_forward_to: test.queue-delivery.forwarded

  # The DLQ rule discards a message
  - name: test.queue-delivery.sms.dlq-discard
    outconn: test.queue-delivery.sms.twilio
    service: test.queue-delivery.channel.target
    max_retries: 1
    retry_sleep_time: 1
    use_queue: true
    dlq_action: discard
    dlq_retry_interval: 1

  # A provider's callback is answered in the provider's own form, so the static responses and the hooks of HTTP channels
  # do not apply - these channels exist so that every key of the shared scenarios names a channel
  - name: test.queue-delivery.sms.static
    outconn: test.queue-delivery.sms.twilio
    service: test.queue-delivery.channel.target
    use_queue: true
    use_dlq: false

  - name: test.queue-delivery.sms.static-xml
    outconn: test.queue-delivery.sms.twilio
    service: test.queue-delivery.channel.target
    use_queue: true
    use_dlq: false

  - name: test.queue-delivery.sms.static-text
    outconn: test.queue-delivery.sms.twilio
    service: test.queue-delivery.channel.target
    use_queue: true
    use_dlq: false

  - name: test.queue-delivery.sms.hooked
    outconn: test.queue-delivery.sms.twilio
    service: test.queue-delivery.channel.hooked
    use_queue: true
    use_dlq: false

  - name: test.queue-delivery.sms.hooked-static
    outconn: test.queue-delivery.sms.twilio
    service: test.queue-delivery.channel.hooked
    use_queue: true
    use_dlq: false

  - name: test.queue-delivery.sms.slow-hook
    outconn: test.queue-delivery.sms.twilio
    service: test.queue-delivery.channel.slow-hook
    use_queue: true
    use_dlq: false

  - name: test.queue-delivery.sms.counting
    outconn: test.queue-delivery.sms.twilio
    service: test.queue-delivery.channel.counting
    use_queue: true
    use_dlq: false
