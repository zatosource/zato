# A PostgreSQL primary and its synchronous standby in the zone without Zato pods, with TLS, which both pods of the pair
# share as the pub/sub database. The Secret postgresql-tls holds the certificate and the CA, the Secret postgresql-init
# holds the init scripts that turn TLS on and admit the replication connection of the standby, and the Secret
# postgresql-auth holds the password of the user. Ordinal 0 is the primary, which every commit of the pods waits on
# until ordinal 1, initialized from it with pg_basebackup, has received it.

apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: ${namespace}
spec:
  selector:
    statefulset.kubernetes.io/pod-name: ${postgresql_primary}
  ports:
    - name: postgresql
      port: ${postgresql_port}
      targetPort: ${postgresql_port}
---
apiVersion: v1
kind: Service
metadata:
  name: ${postgresql_pods_service}
  namespace: ${namespace}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: postgresql
  ports:
    - name: postgresql
      port: ${postgresql_port}
      targetPort: ${postgresql_port}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-external
  namespace: ${namespace}
spec:
  type: NodePort
  selector:
    statefulset.kubernetes.io/pod-name: ${postgresql_primary}
  ports:
    - name: postgresql
      port: ${postgresql_port}
      targetPort: ${postgresql_port}
      nodePort: ${postgresql_node_port}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: ${namespace}
spec:
  serviceName: ${postgresql_pods_service}
  replicas: ${postgresql_replicas}
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      terminationGracePeriodSeconds: 10
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - ${postgresql_zone}
      # The data directory of each instance is created here, before the instance starts. The primary is initialized
      # by the functions of the entrypoint of the image, whose temporary server runs without the arguments of the
      # instance, since a commit under synchronous_standby_names waits for a standby that cannot connect to it.
      # The standby is copied from the primary.
      initContainers:
        - name: data
          image: ${postgresql_image}
          imagePullPolicy: Never
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POSTGRES_USER
              value: ${postgresql_user}
            - name: POSTGRES_DB
              value: ${postgresql_db}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-auth
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          command:
            - /bin/bash
            - -c
            - |
              set -e
              if [ -s "$PGDATA/PG_VERSION" ]; then
                exit 0
              fi
              if [ "$POD_NAME" = "${postgresql_primary}" ]; then
                source docker-entrypoint.sh
                docker_setup_env
                docker_create_db_directories
                exec gosu postgres bash -c '
                  set -e
                  source docker-entrypoint.sh
                  docker_setup_env
                  docker_verify_minimum_env
                  docker_init_database_dir
                  pg_setup_hba_conf
                  export PGPASSWORD="$POSTGRES_PASSWORD"
                  docker_temp_server_start
                  docker_setup_db
                  docker_process_init_files /docker-entrypoint-initdb.d/*
                  docker_temp_server_stop'
              fi
              primary="host=${postgresql_primary}.${postgresql_pods_service} port=${postgresql_port}"
              primary="$primary user=$POSTGRES_USER password=$POSTGRES_PASSWORD"
              primary="$primary sslmode=verify-ca sslrootcert=/certs-in/ca.crt"
              until pg_basebackup -d "$primary" -D "$PGDATA" -R -X stream; do
                rm -rf "$PGDATA"
                sleep 1
              done
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tls
              mountPath: /certs-in
              readOnly: true
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      containers:
        - name: postgresql
          image: ${postgresql_image}
          imagePullPolicy: Never
          args: ${postgresql_args}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POSTGRES_USER
              value: ${postgresql_user}
            - name: POSTGRES_DB
              value: ${postgresql_db}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-auth
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: ${postgresql_port}
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -U
                - ${postgresql_user}
                - -d
                - ${postgresql_db}
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tls
              mountPath: /certs-in
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: tls
          secret:
            secretName: postgresql-tls
        - name: init
          secret:
            secretName: postgresql-init
            defaultMode: 0755
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: ${postgresql_shm_size}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
