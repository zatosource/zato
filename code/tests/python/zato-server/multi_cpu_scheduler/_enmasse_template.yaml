channel_rest:

  # The service that returns the slot of the worker that served the request
  - name: test.multi-cpu.scheduler.worker-slot
    service: test.multi-cpu.worker-slot
    url_path: /test/multi-cpu/worker-slot
    data_format: json

scheduler:

  # The job whose runs complete at once
  - name: test.multi-cpu.scheduler.quick
    service: test.multi-cpu.record-fire
    job_type: interval_based
    seconds: {{interval_seconds}}
    is_active: true
    extra: '{"job": "test.multi-cpu.scheduler.quick", "run_seconds": 0}'

  # The job whose runs take longer than its interval, so that a worker is killed while runs are in progress
  - name: test.multi-cpu.scheduler.slow
    service: test.multi-cpu.record-fire
    job_type: interval_based
    seconds: {{interval_seconds}}
    is_active: true
    extra: '{"job": "test.multi-cpu.scheduler.slow", "run_seconds": {{slow_run_seconds}}}'

  # The job whose interval a test changes
  - name: test.multi-cpu.scheduler.changed
    service: test.multi-cpu.record-fire
    job_type: interval_based
    seconds: {{interval_seconds}}
    is_active: true
    extra: '{"job": "test.multi-cpu.scheduler.changed", "run_seconds": 0}'
