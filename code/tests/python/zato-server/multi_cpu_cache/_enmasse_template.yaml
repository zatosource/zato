channel_rest:

  # The service that returns the slot of the worker that served the request
  - name: test.multi-cpu.cache.worker-slot
    service: test.multi-cpu.worker-slot
    url_path: /test/multi-cpu/worker-slot
    data_format: json

  # The channel that caches the response of the first request
  - name: test.multi-cpu.cache.first
    service: test.multi-cpu.cached-slow
    url_path: /test/multi-cpu/cache/first
    data_format: json
    response_cache:
      is_enabled: true
      ttl: 600
      ttl_unit: seconds
      cache_on_second_request: false

  # The channel that caches the response of the second request
  - name: test.multi-cpu.cache.second
    service: test.multi-cpu.cached-slow
    url_path: /test/multi-cpu/cache/second
    data_format: json
    response_cache:
      is_enabled: true
      ttl: 600
      ttl_unit: seconds
      cache_on_second_request: true
