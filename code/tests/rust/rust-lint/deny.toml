[graph]
all-features = true

# Every advisory fails the check - vulnerabilities, unmaintained and unsound crates anywhere in the graph,
# and yanked versions - and no advisory is ever listed as ignored.
[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
private = { ignore = true }
unused-allowed-license = "allow"
allow = [
  "AGPL-3.0-only",
  "AGPL-3.0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
