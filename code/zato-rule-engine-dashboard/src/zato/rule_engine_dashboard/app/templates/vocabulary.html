{% extends 'base.html' %}
{% load static %}

{% block page_title %}Vocabulary{% endblock %}

{% block styles %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'rule-engine/css/test.css' %}">
<link rel="stylesheet" href="{% static 'rule-engine/css/log.css' %}">
<link rel="stylesheet" href="{% static 'rule-engine/css/vocabulary.css' %}">
{% endblock %}

{% block content %}
<div class="main-column">
  <div class="toolbar">
    <span class="field" data-hint="Filter terms">
      <input class="log-search" id="vocabulary-filter" type="text" placeholder=" ">
    </span>
    <span class="toolbar-separator"></span>
    <button class="button-ghost" id="vocabulary-payload-button"
      onclick="vocabularyView.openPayloadPanel(this)"
      >Add from example</button>
    <button class="button-ghost" id="vocabulary-rules-button"
      onclick="vocabularyView.openRulesPanel(this)">Add from rules</button>
  </div>

  <div class="vocabulary-split">
    <div class="vocabulary-tree-pane" id="vocabulary-tree-pane">
      <div class="vocabulary-tree-head">
        <span id="vocabulary-tree-count"></span>
        <button class="button-mini" id="vocabulary-add-button" onclick="vocabularyView.openAddPanel(this)">Add term</button>
      </div>
      <div class="vocabulary-tree-list" id="vocabulary-tree-list"></div>
    </div>
    <div class="pane-resizer pane-resizer-vertical" id="vocabulary-tree-resizer"></div>
    <div class="vocabulary-detail-pane" id="vocabulary-detail-pane"></div>
  </div>

  <div class="problems-panel">
    <div class="problems-head" id="problems-head">Problems</div>
    <div class="problems-list" id="problems-list"></div>
  </div>
</div>
{% endblock %}

{% block screen_scripts %}
<script src="{% static 'rule-engine/js/data.js' %}"></script>
<script src="{% static 'rule-engine/js/vocabulary.js' %}"></script>
<script src="{% static 'rule-engine/js/vocabulary-model.js' %}"></script>
<script src="{% static 'rule-engine/js/vocabulary-render.js' %}"></script>
<script src="{% static 'rule-engine/js/vocabulary-actions.js' %}"></script>
<script src="{% static 'rule-engine/js/vocabulary-menu.js' %}"></script>
<script src="{% static 'rule-engine/js/vocabulary-drag.js' %}"></script>
{% endblock %}
