{% extends 'base.html' %}
{% load static %}

{% block page_title %}Rule editor{% endblock %}

{% block styles %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'rule-engine/css/editor.css' %}">
{% endblock %}

{% block content %}
<div class="rule-editor" id="rule-editor">
  <div class="main-column">
    <div class="toolbar">
      <span class="view-switcher">
        <button class="button-ghost toggled" data-action="set-view" data-view="sentence">Sentence</button>
        <button class="button-ghost" data-action="set-view" data-view="expression">Expression</button>
        <button class="button-ghost" data-action="set-view" data-view="table">Table</button>
        <button class="button-ghost" data-action="set-view" data-view="document">Document</button>
      </span>
      <button class="button-ghost" data-action="open-rule-menu">Rules</button>
      <span class="toolbar-separator"></span>
      <button class="button-ghost" data-action="open-tests">Test</button>
      <button class="button-primary" data-action="save">Save</button>
    </div>

    <div class="editor-area" id="editor-area"></div>

    <div class="live-panel" id="live-panel"></div>

    <div class="problems-panel">
      <div class="problems-head" id="problems-head">Problems</div>
      <div class="problems-list" id="problems-list"></div>
    </div>
  </div>

  <!-- Vocabulary pane -->
  <div class="vocabulary-pane" id="vocabulary-pane">
    <div class="vocabulary-head">
      <span class="vocabulary-head-label">Vocabulary</span>
      <button class="vocabulary-collapse" id="vocabulary-collapse-button" data-action="toggle-vocabulary"></button>
    </div>
    <div class="vocabulary-list" id="vocabulary-list"></div>
  </div>
</div>
{% endblock %}

{% block screen_scripts %}
<script src="{% static 'rule-engine/js/data.js' %}"></script>
<script src="{% static 'rule-engine/js/vocabulary.js' %}"></script>
<script src="{% static 'rule-engine/js/editor-model.js' %}"></script>
<script src="{% static 'rule-engine/js/editor-checks.js' %}"></script>
<script src="{% static 'rule-engine/js/editor-render.js' %}"></script>
<script src="{% static 'rule-engine/js/editor-views.js' %}"></script>
<script src="{% static 'rule-engine/js/editor-live.js' %}"></script>
<script src="{% static 'rule-engine/js/editor-drag.js' %}"></script>
<script src="{% static 'rule-engine/js/editor-actions.js' %}"></script>
<script>
(function() {
    var search = new URLSearchParams(window.location.search);

    editorView.init(document.getElementById('rule-editor'), {
        urls: {
            rulesets: '/rules/rulesets/?object_type=ruleset',
            vocabularies: '/rules/rulesets/?object_type=vocabulary',
            testSets: '/rules/test-sets/',
            validate: '/rules/editor/validate/',
            render: '/rules/editor/render/',
            save: '/rules/editor/save/',
            outcomes: '/rules/editor/outcomes/',
            preview: function(id) { return '/rules/rulesets/' + id + '/preview/'; },
            vocabularyGet: function(id) { return '/rules/vocabulary/' + id + '/'; },
            completion: function(id) { return '/rules/editor/completion/' + id + '/'; },
        },
        ruleset: search.get('ruleset'),
        rule: search.get('rule'),
        showLivePanel: true,
        rulesetsUrl: '/rulesets/',
        tablesUrl: '/tables/',
        testsUrl: '/tests/',
        navigateToRule: function(rulesetId, ruleKey) {
            window.location.href = '/editor/?ruleset=' + rulesetId + '&rule=' + encodeURIComponent(ruleKey);
        },
    });
})();
</script>
{% endblock %}
