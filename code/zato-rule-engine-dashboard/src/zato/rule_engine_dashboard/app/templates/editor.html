{% extends 'base.html' %}
{% load static %}

{% block page_title %}Rule editor{% endblock %}

{% block styles %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'rule-engine/css/editor.css' %}">
{% endblock %}

{% block content %}
<div class="main-column">
  <div class="toolbar">
    <span class="view-switcher">
      <button class="button-ghost toggled" id="view-sentence" onclick="editorView.setView('sentence')">Sentence</button>
      <button class="button-ghost" id="view-expression" onclick="editorView.setView('expression')">Expression</button>
      <button class="button-ghost" id="view-table" onclick="editorView.setView('table')">Table</button>
      <button class="button-ghost" id="view-document" onclick="editorView.setView('document')">Document</button>
    </span>
    <button class="button-ghost" onclick="editorView.openRuleMenu(event)">Rules</button>
    <span class="toolbar-separator"></span>
    <button class="button-ghost" onclick="editorView.openTests()"
      >Test</button>
    <button class="button-primary" onclick="editorView.save(this)"
      >Save</button>
  </div>

  <div class="editor-area" id="editor-area"></div>

  <div class="live-panel" id="live-panel"></div>

  <div class="problems-panel">
    <div class="problems-head" id="problems-head">Problems</div>
    <div class="problems-list" id="problems-list"></div>
  </div>
</div>

<!-- Vocabulary pane -->
<div class="vocabulary-pane" id="vocabulary-pane">
  <div class="vocabulary-head">
    <span class="vocabulary-head-label">Vocabulary</span>
    <button class="vocabulary-collapse" id="vocabulary-collapse-button" onclick="shared.toggleVocabulary()"></button>
  </div>
  <div class="vocabulary-list" id="vocabulary-list"></div>
</div>
{% endblock %}

{% block screen_scripts %}
<script src="{% static 'rule-engine/js/data.js' %}"></script>
<script src="{% static 'rule-engine/js/vocabulary.js' %}"></script>
<script src="{% static 'rule-engine/js/editor-model.js' %}"></script>
<script src="{% static 'rule-engine/js/editor-checks.js' %}"></script>
<script src="{% static 'rule-engine/js/editor-render.js' %}"></script>
<script src="{% static 'rule-engine/js/editor-views.js' %}"></script>
<script src="{% static 'rule-engine/js/editor-live.js' %}"></script>
<script src="{% static 'rule-engine/js/editor-drag.js' %}"></script>
<script src="{% static 'rule-engine/js/editor-actions.js' %}"></script>
{% endblock %}
