{% extends 'base.html' %}
{% load static %}

{% block page_title %}Tests and simulation{% endblock %}

{% block styles %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'rule-engine/css/test.css' %}">
{% endblock %}

{% block content %}
<div class="main-column">
  <div class="toolbar">
    <button class="button-ghost toggled" id="button-view-scenarios" onclick="testView.showView('scenarios')">Test scenarios</button>
    <button class="button-ghost" id="button-view-ab" onclick="testView.showView('ab')"
      >A/B testing</button>
    <span class="toolbar-separator"></span>
    <button class="button-ghost" id="button-run-all" onclick="testView.runAll(this)">Run all</button>
    <button class="button-ghost" id="button-add-scenario" onclick="testView.addScenario()">Add scenario</button>
    <span class="toolbar-separator"></span>
    <button class="button-primary" onclick="testView.save(this)"
      >Save test set</button>
  </div>

  <div class="test-scenarios-view" id="test-scenarios-view">
    <div class="test-set-pane" id="test-set-pane">
      <div class="test-set-head" id="test-set-head"></div>
      <div class="test-set-list" id="test-set-list"></div>
    </div>
    <div class="pane-resizer pane-resizer-vertical" id="test-set-resizer"></div>
    <div class="test-detail-pane" id="test-detail-pane"></div>
  </div>

  <div class="test-ab-view" id="test-ab-view" style="display:none"></div>

  <div class="problems-panel">
    <div class="problems-head" id="problems-head">Problems</div>
    <div class="problems-list" id="problems-list"></div>
  </div>
</div>

<!-- Vocabulary pane -->
<div class="vocabulary-pane" id="vocabulary-pane">
  <div class="vocabulary-head">
    <span class="vocabulary-head-label">Vocabulary</span>
  </div>
  <div class="vocabulary-list" id="vocabulary-list"></div>
</div>
{% endblock %}

{% block screen_scripts %}
<script src="{% static 'rule-engine/js/data.js' %}"></script>
<script src="{% static 'rule-engine/js/vocabulary.js' %}"></script>
<script src="{% static 'rule-engine/js/test-model.js' %}"></script>
<script src="{% static 'rule-engine/js/test-run.js' %}"></script>
<script src="{% static 'rule-engine/js/test-render.js' %}"></script>
<script src="{% static 'rule-engine/js/test-ab.js' %}"></script>
<script src="{% static 'rule-engine/js/test-menu.js' %}"></script>
<script src="{% static 'rule-engine/js/test-actions.js' %}"></script>
{% endblock %}
