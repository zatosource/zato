{% extends 'base.html' %}

{% block page_title %}Sign in{% endblock %}

{% block styles %}{% endblock %}

{% block navigation %}{% endblock %}

{% block content %}

<div class="auth-screen">
  <div class="auth-panel">

    <div class="auth-logo" role="img" aria-label="Zato"></div>

    {% if messages %}
    <ul class="messages">
      {% for message in messages %}
      <li class="{{ message.tags }}">{{ message }}</li>
      {% endfor %}
    </ul>
    {% endif %}

    <form method="post" action="{% url 'login' %}" class="form-card">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form-row">
        <label for="id_username">Username</label>
        <input id="id_username" type="text" name="username" autofocus>
      </div>
      <div class="form-row">
        <label for="id_password">Password</label>
        <input id="id_password" type="password" name="password">
      </div>
      <button class="button-primary auth-submit" type="submit">Sign in</button>
    </form>

  </div>
</div>

{% endblock %}
