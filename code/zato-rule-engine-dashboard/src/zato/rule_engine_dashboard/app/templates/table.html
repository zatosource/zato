{% extends 'base.html' %}
{% load static %}

{% block page_title %}Decision tables{% endblock %}

{% block styles %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'rule-engine/css/table.css' %}">
{% endblock %}

{% block content %}
<div class="main-column">
  <div class="toolbar">
    <button class="button-ghost" id="button-completeness" onclick="tableView.checkCompleteness()"
      >Check completeness</button>
    <button class="button-ghost" id="button-conflicts" onclick="tableView.checkConflicts()">Check conflicts</button>
    <button class="button-ghost" id="button-unfold" onclick="tableView.toggleUnfoldAll()">Unfold rules</button>
    <button class="button-ghost" id="button-compress" onclick="tableView.compress()"
      >Compress</button>
    <span class="toolbar-separator"></span>
    <button class="button-ghost" id="button-phrases" onclick="tableView.togglePhrases()"
      >Phrases</button>
    <span class="table-phrase-note" id="table-phrase-note">Phrase view</span>
    <span class="toolbar-separator"></span>
    <span class="field" data-hint="Find in table">
      <input type="text" id="find-input" placeholder=" " oninput="tableView.render()">
    </span>
    <span class="field" data-hint="Replace with">
      <input type="text" id="replace-input" placeholder=" ">
    </span>
    <button class="button-ghost" id="button-replace" onclick="tableView.doReplace()">Replace</button>
    <span class="toolbar-separator"></span>
    <button class="button-ghost" id="button-add-column" onclick="tableView.addColumn()">Add rule column</button>
    <button class="button-ghost" onclick="tableView.openTests()"
      >Test</button>
    <button class="button-primary" onclick="tableView.save(this)"
      >Save</button>
  </div>

  <div class="table-grid-area" id="table-grid-area"></div>

  <div class="table-sentence-bar" id="table-sentence-bar"></div>

  <div class="problems-panel">
    <div class="problems-head" id="problems-head">Problems</div>
    <div class="problems-list" id="problems-list"></div>
  </div>
</div>

<!-- Vocabulary pane -->
<div class="vocabulary-pane" id="vocabulary-pane">
  <div class="vocabulary-head">
    <span class="vocabulary-head-label">Vocabulary</span>
  </div>
  <div class="vocabulary-list" id="vocabulary-list"></div>
</div>
{% endblock %}

{% block screen_scripts %}
<script src="{% static 'rule-engine/js/data.js' %}"></script>
<script src="{% static 'rule-engine/js/vocabulary.js' %}"></script>
<script src="{% static 'rule-engine/js/table-model.js' %}"></script>
<script src="{% static 'rule-engine/js/table-checks.js' %}"></script>
<script src="{% static 'rule-engine/js/table-render.js' %}"></script>
<script src="{% static 'rule-engine/js/table-grid.js' %}"></script>
<script src="{% static 'rule-engine/js/table-phrases.js' %}"></script>
<script src="{% static 'rule-engine/js/table-drag.js' %}"></script>
<script src="{% static 'rule-engine/js/table-menu.js' %}"></script>
<script src="{% static 'rule-engine/js/table-edit.js' %}"></script>
<script src="{% static 'rule-engine/js/table-actions.js' %}"></script>
{% endblock %}
