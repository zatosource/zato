{% extends 'base.html' %}
{% load static %}

{% block page_title %}Decision log{% endblock %}

{% block styles %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'rule-engine/css/test.css' %}">
<link rel="stylesheet" href="{% static 'rule-engine/css/log.css' %}">
{% endblock %}

{% block content %}
<div class="main-column">
  <div class="toolbar">
    <input class="log-search" id="log-search" type="text" placeholder="Business key or decision id...">
    <select class="log-range" id="log-range" onchange="logView.setRange(this)">
      <option value="1">Today</option>
      <option value="3">Last 3 days</option>
      <option value="7" selected>Last 7 days</option>
    </select>
    <span class="toolbar-separator"></span>
    <button class="button-ghost" onclick="window.location.href='/tests/'">A/B testing</button>
    <button class="button-ghost" id="log-rule-counts-button" onclick="logView.openRuleCounts(this)">Rule counts</button>
    <button class="button-ghost" id="log-capture-button" onclick="logView.openCapturePanel(this)">Capture and retention</button>
  </div>

  <div class="log-aggregates" id="log-aggregates"></div>

  <div class="log-split">
    <div class="log-list-pane" id="log-list-pane">
      <div class="log-list-head" id="log-list-head"></div>
      <div class="log-list" id="log-list"></div>
    </div>
    <div class="pane-resizer pane-resizer-vertical" id="log-list-resizer"></div>
    <div class="log-detail-pane" id="log-detail-pane"></div>
  </div>

  <div class="problems-panel">
    <div class="problems-head" id="problems-head">Problems</div>
    <div class="problems-list" id="problems-list"></div>
  </div>
</div>
{% endblock %}

{% block screen_scripts %}
<script src="{% static 'rule-engine/js/data.js' %}"></script>
<script src="{% static 'rule-engine/js/vocabulary.js' %}"></script>
<script src="{% static 'rule-engine/js/log-model.js' %}"></script>
<script src="{% static 'rule-engine/js/log-render.js' %}"></script>
<script src="{% static 'rule-engine/js/log-menu.js' %}"></script>
<script src="{% static 'rule-engine/js/log-actions.js' %}"></script>
{% endblock %}
