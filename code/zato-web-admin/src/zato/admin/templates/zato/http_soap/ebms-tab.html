{% comment %} The ebMS tab of a SOAP channel's create form, included with panel_id {% endcomment %}
<div class="dashboard-tab-panel alerts-tab-panel ebms-tab-panel" id="{{ panel_id }}" role="tabpanel" hidden>
    <div class="form-data alerts-tab-body">

        <div class="alerts-tab-sections">

            <div class="alerts-tab-section">
                <div class="alerts-tab-section-title">Agreement</div>
                <div class="decision-lines">
                    <div class="decision-line alerts-tab-line alerts-tab-line-popover" id="{{ panel_id }}-line-cpa_file">
                        <label class="decision-line-label" for="{{ panel_id }}-edit-cpa_file">CPA</label>
                        <span class="decision-line-slot"><a href="javascript:void(0)" class="summary-link" id="{{ panel_id }}-edit-cpa_file"><span class="zato-link-face summary-link-text" id="{{ panel_id }}-summary-cpa_file"></span><span class="zato-soft-hint">Click to import</span></a></span>
                    </div>
                    <div class="decision-line alerts-tab-line alerts-tab-line-popover" id="{{ panel_id }}-line-agreement">
                        <label class="decision-line-label" for="{{ panel_id }}-edit-agreement">CPA ID</label>
                        <span class="decision-line-slot"><a href="javascript:void(0)" class="summary-link" id="{{ panel_id }}-edit-agreement"><span class="zato-link-face summary-link-text" id="{{ panel_id }}-summary-agreement"></span><span class="zato-soft-hint">Click to edit</span></a></span>
                    </div>
                    <div class="decision-line alerts-tab-line alerts-tab-line-popover" id="{{ panel_id }}-line-host_party">
                        <label class="decision-line-label" for="{{ panel_id }}-edit-host_party">Our party</label>
                        <span class="decision-line-slot"><a href="javascript:void(0)" class="summary-link" id="{{ panel_id }}-edit-host_party"><span class="zato-link-face summary-link-text" id="{{ panel_id }}-summary-host_party"></span><span class="zato-soft-hint">Click to edit</span></a></span>
                    </div>
                    <div class="decision-line alerts-tab-line alerts-tab-line-popover" id="{{ panel_id }}-line-partner_party">
                        <label class="decision-line-label" for="{{ panel_id }}-edit-partner_party">Partner</label>
                        <span class="decision-line-slot"><a href="javascript:void(0)" class="summary-link" id="{{ panel_id }}-edit-partner_party"><span class="zato-link-face summary-link-text" id="{{ panel_id }}-summary-partner_party"></span><span class="zato-soft-hint">Click to edit</span></a></span>
                    </div>
                    <div class="decision-line alerts-tab-line alerts-tab-line-popover" id="{{ panel_id }}-line-actions">
                        <label class="decision-line-label" for="{{ panel_id }}-edit-actions">Accepted actions</label>
                        <span class="decision-line-slot"><a href="javascript:void(0)" class="summary-link" id="{{ panel_id }}-edit-actions"><span class="zato-link-face summary-link-text" id="{{ panel_id }}-summary-actions"></span><span class="zato-soft-hint">Click to edit</span></a></span>
                    </div>
                </div>
            </div>

            <div class="alerts-tab-section">
                <div class="alerts-tab-section-title">Security</div>
                <div class="decision-lines">
                    <div class="decision-line alerts-tab-line alerts-tab-line-popover" id="{{ panel_id }}-line-signatures">
                        <label class="decision-line-label" for="{{ panel_id }}-edit-signatures">Signatures</label>
                        <span class="decision-line-slot"><a href="javascript:void(0)" class="summary-link" id="{{ panel_id }}-edit-signatures"><span class="zato-link-face summary-link-text" id="{{ panel_id }}-summary-signatures"></span><span class="zato-soft-hint">Click to edit</span></a></span>
                    </div>
                    <div class="decision-line alerts-tab-line alerts-tab-line-popover" id="{{ panel_id }}-line-acknowledgments">
                        <label class="decision-line-label" for="{{ panel_id }}-edit-acknowledgments">Acknowledgments</label>
                        <span class="decision-line-slot"><a href="javascript:void(0)" class="summary-link" id="{{ panel_id }}-edit-acknowledgments"><span class="zato-link-face summary-link-text" id="{{ panel_id }}-summary-acknowledgments"></span><span class="zato-soft-hint">Click to edit</span></a></span>
                    </div>
                </div>
            </div>

            <div class="alerts-tab-section">
                <div class="alerts-tab-section-title">Reliability</div>
                <div class="decision-lines">
                    <div class="decision-line alerts-tab-line alerts-tab-line-popover" id="{{ panel_id }}-line-duplicates">
                        <label class="decision-line-label" for="{{ panel_id }}-edit-duplicates">Duplicate elimination</label>
                        <span class="decision-line-slot"><a href="javascript:void(0)" class="summary-link" id="{{ panel_id }}-edit-duplicates"><span class="zato-link-face summary-link-text" id="{{ panel_id }}-summary-duplicates"></span><span class="zato-soft-hint">Click to edit</span></a></span>
                    </div>
                    <div class="decision-line alerts-tab-line alerts-tab-line-toggle" id="{{ panel_id }}-line-accept_lf">
                        <label class="decision-line-label" for="ebms-tab-field-accept_lf">Accept LF line endings</label>
                        <span class="decision-line-slot"><input type="checkbox" id="ebms-tab-field-accept_lf" checked /></span>
                    </div>
                </div>
            </div>

        </div>

        <div class="alerts-tab-hidden-fields" hidden>
            <input type="file" id="ebms-tab-field-cpa_file" accept=".xml" />
            <input type="text" id="ebms-tab-field-cpa_id" />

            <input type="text" id="ebms-tab-field-host_party_id" />
            <select id="ebms-tab-field-host_party_id_type">
                <option value="urn:oasis:names:tc:ebXML-cppa:partyid-type:duns">DUNS</option>
                <option value="urn:oasis:names:tc:ebXML-cppa:partyid-type:gln">GLN</option>
                <option value="string">String</option>
            </select>
            <input type="text" id="ebms-tab-field-host_role" />

            <input type="text" id="ebms-tab-field-partner_party_id" />
            <select id="ebms-tab-field-partner_party_id_type">
                <option value="urn:oasis:names:tc:ebXML-cppa:partyid-type:duns">DUNS</option>
                <option value="urn:oasis:names:tc:ebXML-cppa:partyid-type:gln">GLN</option>
                <option value="string">String</option>
            </select>
            <input type="text" id="ebms-tab-field-partner_role" />

            <input type="text" id="ebms-tab-field-service_filter" />
            <input type="text" id="ebms-tab-field-action_filter" />

            <input type="checkbox" id="ebms-tab-field-verify_signature" checked />
            <select id="ebms-tab-field-signature_definition"></select>
            <select id="ebms-tab-field-key_source">
                <option value="message-pinned">From the message, pinned to the definition</option>
                <option value="definition">From the definition only</option>
            </select>
            <select id="ebms-tab-field-signature_algorithm">
                <option value="rsa-sha1">RSA-SHA1</option>
                <option value="rsa-sha256">RSA-SHA256</option>
            </select>
            <select id="ebms-tab-field-digest_algorithm">
                <option value="sha1">SHA-1</option>
                <option value="sha256">SHA-256</option>
            </select>
            <select id="ebms-tab-field-canonicalization">
                <option value="c14n">Canonical XML 1.0</option>
                <option value="exc-c14n">Exclusive Canonical XML 1.0</option>
            </select>
            <select id="ebms-tab-field-min_key_size">
                <option value="1024">1024 bits</option>
                <option value="2048" selected>2048 bits</option>
                <option value="3072">3072 bits</option>
                <option value="4096">4096 bits</option>
            </select>

            <select id="ebms-tab-field-ack_mode">
                <option value="sync">Synchronous</option>
                <option value="async">Asynchronous</option>
                <option value="none">None</option>
            </select>
            <input type="text" id="ebms-tab-field-ack_url" />
            <input type="checkbox" id="ebms-tab-field-sign_ack" checked />

            <input type="checkbox" id="ebms-tab-field-duplicate_elimination" checked />
            <input type="text" id="ebms-tab-field-retention" value="7" />
            <select id="ebms-tab-field-retention_unit">
                <option value="hour">hours</option>
                <option value="day" selected>days</option>
            </select>
        </div>

    </div>
</div>
