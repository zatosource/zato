security:

  - name: demo.healthcare.mcp
    type: bearer_token
    static_token: healthcare-demo
    static_header: Authorization
    static_prefix: Bearer

groups:

  - name: mcp.demo.healthcare
    members:
      - demo.healthcare.mcp

mcp_gateway:

  - name: demo.healthcare
    public_name: Healthcare
    url_path: /mcp/healthcare
    services:
      - healthcare.get-scorecard
      - healthcare.track-care-flow
      - healthcare.review-quality
      - healthcare.assess-workforce
      - healthcare.track-finance
    sql_connections:
      - demo.healthcare.warehouse
      - demo.healthcare.finance
      - demo.healthcare.workforce
    security_groups:
      - mcp.demo.healthcare
    validate_input: true
    is_audit_log_active: true
