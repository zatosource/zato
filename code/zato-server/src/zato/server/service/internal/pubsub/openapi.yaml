openapi: 3.1.1
info:
  title: Zato Pub/Sub REST API
  description: |
    REST API for Zato's publish/subscribe messaging system.
    All operations require HTTP Basic Authentication.
  version: 4.1.0
  contact:
    name: Zato Source
    url: https://zato.io

servers:
  - url: http://localhost:11223

security:
  - basicAuth: []

paths:
  /pubsub/topic/{topic_name}:
    post:
      summary: Publish a message to a topic
      description: |
        Publish a message to the specified topic. The user must have publish permissions for the topic.
        Topic names are validated and must meet specific requirements.
        A request with a msg_id that is already stored with the same content returns the stored message
        without storing it again, which makes a repeated request idempotent. A msg_id that is stored with
        different content is rejected with 409.
      parameters:
        - name: topic_name
          in: path
          required: true
          description: Name of the topic to publish to
          schema:
            type: string
            maxLength: 200
            pattern: '^[\x20-\x22\x24-\x7E]*$'
            example: orders.processed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  description: The message content
                  oneOf:
                    - type: string
                    - type: object
                  example: "Order #12345 has been processed"
                priority:
                  type: integer
                  minimum: 0
                  maximum: 9
                  default: 5
                  description: Message priority (0=lowest, 9=highest)
                expiration:
                  type: integer
                  minimum: 1
                  default: 31536000
                  description: Message expiration time in seconds
                correl_id:
                  type: string
                  description: Correlation ID for message tracking
                  example: order-12345-notification
                in_reply_to:
                  type: string
                  description: ID of message this is replying to
                ext_client_id:
                  type: string
                  description: External client identifier
                pub_time:
                  type: string
                  format: date-time
                  description: Custom publication time (ISO format with timezone)
                msg_id:
                  type: string
                  pattern: '^[A-Za-z0-9._:-]{1,200}$'
                  description: |
                    Message ID supplied by the client. A new ID is generated if this element is absent.
                    The msg_id is deduplicated for as long as its message is retained, which ends when the message
                    expires or when the retention of fully delivered messages removes it.
                  example: order-12345.notification
            examples:
              simple_message:
                summary: Simple text message
                value:
                  data: "Order #12345 has been processed"
              json_message:
                summary: JSON message with metadata
                value:
                  data:
                    order_id: 12345
                    status: completed
                    timestamp: "2025-01-01T12:00:00Z"
                  priority: 8
                  expiration: 7200
                  correl_id: order-12345-notification
              idempotent_message:
                summary: Message with a message ID supplied by the client
                value:
                  data: "Order #12345 has been processed"
                  msg_id: order-12345.notification
      responses:
        '200':
          description: Message published successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
        '400':
          description: Bad request (invalid topic name, missing data, invalid msg_id, malformed JSON)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
                description: HTML error page for malformed requests
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
                description: HTML error page for malformed requests
        '403':
          description: The topic is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The msg_id is already stored with different content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
                description: HTML error page for malformed requests

  /pubsub/subscribe/topic/{topic_name}:
    post:
      summary: Subscribe to a topic
      description: |
        Subscribe to receive messages from the specified topic. The user must have subscribe permissions for the topic.
        Topics are automatically created if they don't exist.
      parameters:
        - name: topic_name
          in: path
          required: true
          description: Name of the topic to subscribe to
          schema:
            type: string
            maxLength: 200
            pattern: '^[\x20-\x22\x24-\x7E]*$'
            example: orders.processed
      responses:
        '200':
          description: Successfully subscribed to topic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request (invalid topic name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
                description: HTML error page for malformed requests
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
                description: HTML error page for malformed requests
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
                description: HTML error page for malformed requests

  /pubsub/messages/get:
    post:
      summary: Retrieve messages from subscribed topics
      description: |
        Get messages from all topics the user is subscribed to. Messages are delivered in priority order
        (highest priority first), then by publish time (oldest first) within the same priority level.
        Retrieved messages are reserved for this client and remain in the queue until the client acknowledges them
        through /pubsub/messages/ack. A message that is not acknowledged within the reservation period, 30 seconds
        by default, is retrieved again by the next call.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                max_messages:
                  type: integer
                  minimum: 0
                  maximum: 1000
                  default: 50
                  description: Maximum number of messages to retrieve
                max_len:
                  type: integer
                  minimum: 0
                  maximum: 5000000
                  default: 5000000
                  description: Maximum total length of message data in bytes
            examples:
              default_params:
                summary: Use default parameters
                value: {}
              custom_params:
                summary: Custom parameters
                value:
                  max_messages: 10
                  max_len: 1000000
              batch_processing:
                summary: Batch processing
                value:
                  max_messages: 100
                  max_len: 2000000
      responses:
        '200':
          description: Messages retrieved successfully
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MessagesListResponse'
                  - $ref: '#/components/schemas/SingleMessageResponse'
        '400':
          description: Bad request (malformed JSON, no subscription found for user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
                description: HTML error page for malformed requests
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
                description: HTML error page for malformed requests
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
                description: HTML error page for malformed requests

  /pubsub/messages/ack:
    post:
      summary: Acknowledge retrieved messages
      description: |
        Removes messages retrieved through /pubsub/messages/get from the queue of the user.

        A request that is a list of msg_id values removes the messages that are still in the queue. Messages that were
        already acknowledged, or that are no longer in the queue, are not counted.

        A request that is an object with consumed names the delivery_attempt with which each message was retrieved,
        and it may publish messages in the same transaction through publish. The acknowledgement and the publications
        are committed together or not at all. A message retrieved again after its reservation expired has a higher
        delivery_attempt, and an acknowledgement of the earlier attempt is rejected with 409, with nothing published.
        A repeated request that was already committed returns 200 with the same msg_id values in published.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: array
                  maxItems: 1000
                  items:
                    type: string
                    pattern: '^[A-Za-z0-9._:-]{1,200}$'
                  description: The msg_id values of the messages to acknowledge
                - type: object
                  required:
                    - consumed
                  properties:
                    consumed:
                      type: array
                      maxItems: 1000
                      items:
                        $ref: '#/components/schemas/ConsumedMessage'
                      description: The messages to acknowledge, each with the delivery_attempt with which it was retrieved
                    publish:
                      type: array
                      maxItems: 1000
                      items:
                        $ref: '#/components/schemas/AckPublication'
                      description: Messages published in the same transaction as the acknowledgement
            examples:
              two_messages:
                summary: Two messages
                value:
                  - zpsm.20250829-074432-7264-d47439a9f-abc
                  - zpsm.20250829-074433-1182-a03b5c71e-abc
              with_publications:
                summary: One message acknowledged together with two publications
                value:
                  consumed:
                    - msg_id: zpsm.20250829-074432-7264-d47439a9f-abc
                      delivery_attempt: 1
                  publish:
                    - topic_name: invoices
                      data:
                        order_id: 12345
                      msg_id: zpsm.20250829-074432-7264-d47439a9f-abc.invoice
                    - topic_name: audit
                      data:
                        order_id: 12345
                      msg_id: zpsm.20250829-074432-7264-d47439a9f-abc.audit
      responses:
        '200':
          description: Messages acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '400':
          description: |
            Bad request (a request that is neither a list nor an object with consumed, a list that is not a list
            or has more than 1000 elements, an invalid msg_id or delivery_attempt, or a publication that is invalid
            or names a topic not stored in the pub/sub database)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed, no subscription found for user, or no permission to publish to a topic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A topic of a publication is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            The acknowledgement names an attempt that is no longer current, the message was concluded with other
            publications, or the msg_id of a publication is already stored with different content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Demo credentials:
        - Username: user.1
        - Password: password.1

  schemas:
    SuccessResponse:
      type: object
      required:
        - is_ok
        - cid
      properties:
        is_ok:
          type: boolean
          example: true
        cid:
          type: string
          description: Correlation ID for request tracking
          example: correlation-id-123
        status:
          type: string
          example: "200 OK"

    PublishResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - msg_id
          properties:
            msg_id:
              type: string
              description: Unique message identifier, generated or supplied by the publisher
              pattern: '^[A-Za-z0-9._:-]{1,200}$'
              example: zpsm.20250829-074432-7264-d47439a9f-abc

    AckResponse:
      type: object
      required:
        - is_ok
        - cid
        - ack_count
        - status
      properties:
        is_ok:
          type: boolean
          example: true
        cid:
          type: string
          description: Correlation ID for request tracking
          example: correlation-id-123
        ack_count:
          type: integer
          description: How many of the messages were still in the queue and were removed from it
          example: 2
        published:
          type: array
          items:
            type: string
          description: The msg_id of each publication of a request with consumed, in the order of publish
          example:
            - zpsm.20250829-074432-7264-d47439a9f-abc.invoice
            - zpsm.20250829-074432-7264-d47439a9f-abc.audit
        status:
          type: string
          description: HTTP status description
          example: "200 OK"

    ConsumedMessage:
      type: object
      required:
        - msg_id
        - delivery_attempt
      properties:
        msg_id:
          type: string
          pattern: '^[A-Za-z0-9._:-]{1,200}$'
          description: The msg_id of a retrieved message
          example: zpsm.20250829-074432-7264-d47439a9f-abc
        delivery_attempt:
          type: integer
          minimum: 1
          description: The delivery_attempt with which the message was retrieved
          example: 1

    AckPublication:
      type: object
      required:
        - topic_name
        - data
      properties:
        topic_name:
          type: string
          maxLength: 200
          description: Name of the topic to publish to
          example: invoices
        data:
          description: The message content
          oneOf:
            - type: string
            - type: object
        priority:
          type: integer
          minimum: 0
          maximum: 9
          default: 5
          description: Message priority (0=lowest, 9=highest)
        expiration:
          type: integer
          minimum: 1
          default: 31536000
          description: Message expiration time in seconds
        correl_id:
          type: string
          description: Correlation ID for message tracking
        in_reply_to:
          type: string
          description: ID of message this is replying to
        ext_client_id:
          type: string
          description: External client identifier
        pub_time:
          type: string
          format: date-time
          description: Custom publication time (ISO format with timezone)
        msg_id:
          type: string
          pattern: '^[A-Za-z0-9._:-]{1,200}$'
          description: |
            Message ID supplied by the client. A msg_id derived from the msg_id of the consumed message makes
            a repeated request publish the same messages.
          example: zpsm.20250829-074432-7264-d47439a9f-abc.invoice

    ErrorResponse:
      type: object
      required:
        - is_ok
        - cid
        - details
        - status
      properties:
        is_ok:
          type: boolean
          example: false
        cid:
          type: string
          description: Correlation ID for request tracking
          example: correlation-id-123
        details:
          type: string
          description: Error description
          example: Authentication failed
        status:
          type: string
          description: HTTP status description
          example: "401 Unauthorized"

    MessageMetadata:
      type: object
      required:
        - topic_name
        - size
        - priority
        - expiration
        - msg_id
        - delivery_attempt
        - pub_time_iso
        - recv_time_iso
        - time_since_pub
        - time_since_recv
      properties:
        topic_name:
          type: string
          description: Topic the message was published to
          example: orders.processed
        size:
          type: integer
          description: Message size in bytes
          example: 123
        priority:
          type: integer
          minimum: 0
          maximum: 9
          description: Message priority
          example: 5
        expiration:
          type: integer
          description: Message expiration time in seconds
          example: 3600
        msg_id:
          type: string
          description: Unique message identifier, generated or supplied by the publisher
          pattern: '^[A-Za-z0-9._:-]{1,200}$'
          example: zpsm.20250829-074432-7264-d47439a9f-abc
        delivery_attempt:
          type: integer
          minimum: 1
          description: How many times the message was retrieved, 1 for the first retrieval and higher for each repeated one
          example: 1
        correl_id:
          type: string
          description: Correlation ID for message tracking
          example: order-12345
        pub_time_iso:
          type: string
          format: date-time
          description: When the message was published (ISO format with timezone)
          example: "2025-01-01T12:00:00+00:00"
        recv_time_iso:
          type: string
          format: date-time
          description: When the message was received by the system (ISO format with timezone)
          example: "2025-01-01T12:00:01+00:00"
        expiration_time_iso:
          type: string
          format: date-time
          description: When the message will expire (ISO format with timezone)
          example: "2025-01-01T13:00:00+00:00"
        time_since_pub:
          type: string
          description: Time elapsed since message was published (duration format)
          example: "0:00:30.123456"
        time_since_recv:
          type: string
          description: Time elapsed since message was received (duration format)
          example: "0:00:30.123456"
        in_reply_to:
          type: string
          description: ID of message this is replying to
        ext_client_id:
          type: string
          description: External client identifier

    Message:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: The actual message content
          oneOf:
            - type: string
            - type: object
          example:
            order_id: 12345
            status: completed
            amount: 299.99
            currency: EUR
        meta:
          $ref: '#/components/schemas/MessageMetadata'

    MessagesListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - messages
            - message_count
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message'
              description: Array of retrieved messages
            message_count:
              type: integer
              description: Number of messages returned
              example: 3

    SingleMessageResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
            - meta
          properties:
            data:
              description: The actual message content
              oneOf:
                - type: string
                - type: object
              example: "Hello World"
            meta:
              allOf:
                - $ref: '#/components/schemas/MessageMetadata'
                - type: object
                  required:
                    - message_count
                  properties:
                    message_count:
                      type: integer
                      description: Number of messages returned (always 1 for single message response)
                      example: 1

tags:
  - name: Publishing
    description: Operations for publishing messages to topics
  - name: Subscription
    description: Operations for managing topic subscriptions
  - name: Messaging
    description: Operations for retrieving messages
